# Autobuild the macOS .app with PyInstaller and upload it as an artifact.
#
# Builds both architectures: macos-15-intel (Intel/x86_64) and macos-14 (Apple
# Silicon/arm64). Each runner builds natively for its own arch. (macos-13, the
# old Intel runner, was retired by GitHub.)
#
# The steps follow the Windows and Linux builds: the viewer shell
# (wraithguard-viewer, Tauri on the system WKWebView - no extra runtime) is built
# with cargo and bundled beside the app, and the Rust backend (native/, greatness7's
# tes3 crates) is built into the free-threaded interpreter PyInstaller freezes.
#
# The build is UNSIGNED (no Apple Developer cert in CI). First launch: right-
# click -> Open, or clear quarantine: `xattr -dr com.apple.quarantine <app>`.
# Add codesign + notarization steps here once a certificate is available.

name: Build macOS app

on:
  workflow_dispatch:
  push:
    # A `v*` tag cuts a release (Release/sign steps are tag-gated). A `build/**`
    # branch is a dry run: it builds and uploads the binary as an artifact but
    # attaches nothing, to prove the free-threaded wheels compile first.
    tags: ["v*"]
    branches: ["build/**"]

permissions:
  contents: write # create/attach to a Release on tag builds

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel # Intel
            arch: x86_64
          - runner: macos-14 # Apple Silicon
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            viewer-shell/target
          key: cargo-macos-${{ matrix.arch }}-${{ hashFiles('viewer-shell/Cargo.lock') }}

      - name: Build the viewer shell
        # The icon is copied in first: tauri-build wants it at compile time (see
        # viewer-shell/icons/README.md).
        run: |
          cp wraithguard_toolkit_icon.ico viewer-shell/icons/wraithguard_toolkit_icon.ico
          cd viewer-shell
          cargo build --release
          ls -lh target/release/wraithguard-viewer

      - uses: actions/setup-python@v5
        with:
          # Free-threaded Python 3.14 (`3.14t`), the build the app ships;
          # setup-python's macOS build bundles Tcl/Tk. Some wheels may not yet
          # publish a `cp314t` build and can source-build here while the ecosystem
          # catches up.
          python-version: "3.14t"
          allow-prereleases: true
          cache: pip

      - name: Verify the free-threaded build
        # Fail before the heavy PyInstaller build if setup-python fell back to a
        # GIL interpreter -- otherwise the shipped app is not free-threaded.
        run: |
          python --version
          python -c "import sys; assert not sys._is_gil_enabled(), 'GIL is enabled -- not a free-threaded build'; print('free-threaded OK')"

      - name: Install build dependencies
        # The Windows/Linux pip set. No pywebview: the viewer shell replaces the
        # old in-process viewer. Pillow is extra -- only to make the .icns app
        # icon, and excluded from the bundle. No `pip install .`; PyInstaller
        # builds straight from the checked-out source.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir \
            pyinstaller tkinterweb tkinterdnd2 PyYAML ijson certifi pillow

      - name: Build the Rust backend (native/, greatness7's tes3 crates)
        run: python -m pip install ./native

      - name: Make the .icns app icon from the .ico
        # PyInstaller wants a .icns on macOS. Build one from the largest frame of
        # the shipped .ico via Pillow + the system iconutil. Best-effort: a
        # failure here must not sink the build, so the next step falls back to
        # PyInstaller's default icon.
        continue-on-error: true
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from PIL import Image

          src = Image.open("wraithguard_toolkit_icon.ico").convert("RGBA")
          iconset = Path("icon.iconset")
          iconset.mkdir(exist_ok=True)
          for size in (16, 32, 128, 256, 512):
              src.resize((size, size), Image.LANCZOS).save(iconset / f"icon_{size}x{size}.png")
              src.resize((size * 2, size * 2), Image.LANCZOS).save(
                  iconset / f"icon_{size}x{size}@2x.png"
              )
          subprocess.run(
              ["iconutil", "-c", "icns", "icon.iconset", "-o", "wraithguard_toolkit_icon.icns"],
              check=True,
          )
          PY

      - name: Build the .app
        # Flags follow the Dockerfile, adapted for macOS:
        #  * --windowed with no --onefile -> a proper onedir .app bundle (the
        #    macOS norm; onefile re-extracts to a temp dir on every launch).
        #  * Cocoa webview instead of the Qt platform + clr/pythonnet .NET bits.
        #  * --add-data uses ':' on macOS (';' on Windows); viz assets -> "assets"
        #    to match the frozen lookup in wraithguard/viz/library.py.
        run: |
          ICON=""
          if [ -f wraithguard_toolkit_icon.icns ]; then
            ICON="--icon=wraithguard_toolkit_icon.icns"
          fi
          pyinstaller --noconfirm --clean --windowed \
            --name "Wraithguard Toolkit" \
            $ICON \
            --collect-submodules wraithguard \
            --hidden-import wraithguard_native \
            --collect-all certifi \
            --hidden-import tkinterweb \
            --exclude-module PIL \
            --add-binary "viewer-shell/target/release/wraithguard-viewer:." \
            --add-data "wraithguard_toolkit.py:." \
            --add-data "README.md:." \
            --add-data "QUICKSTART.md:." \
            --add-data "MLOX_RULES.md:." \
            --add-data "CREDITS.md:." \
            --add-data "License:License" \
            --add-data "viewer-shell/ui/LICENSE:License/viewer-page" \
            --add-data "wraithguard_toolkit_icon.ico:." \
            --add-data "wraithguard/viz/assets:assets" \
            wraithguard_toolkit_gui.py

      - name: Zip the .app
        # A .app is a directory; upload-artifact would flatten it and lose the
        # executable bit. ditto preserves the bundle structure and permissions.
        run: |
          cd dist
          ditto -c -k --keepParent "Wraithguard Toolkit.app" \
            "Wraithguard-Toolkit-macos-${{ matrix.arch }}.zip"

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: wraithguard-toolkit-macos-${{ matrix.arch }}
          path: dist/Wraithguard-Toolkit-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Wraithguard-Toolkit-macos-${{ matrix.arch }}.zip
          fail_on_unmatched_files: false
          # No generate_release_notes here: this step runs once per matrix arch
          # (x86_64 + arm64), and each softprops call with it set regenerates and
          # appends a "Full Changelog" block to the shared release. Exactly one job
          # owns the notes -- the single-run Linux build -- so the release gets one
          # changelog, not five. This step only uploads its .zip.
