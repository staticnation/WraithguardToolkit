# The program without Python (port step 4.5, slice 5; viewer-shell/DROP-TK.md): one Tauri
# build per platform. Each package holds
#
#   wraithguard-toolkit   the program: started on its own it opens on the settings file's
#                        openmw.cfg, or on its Setup page (no Python, no Tk)
#   wraithguard          the command line (viewer-shell/cli): the sort, export and scans
#   QUICKSTART.md ...    the documents its Help page shows
#
# The only release build since 5.0 (the PyInstaller builds went with the Python app).
#
# Linux also gets an AppImage (linux-appimage below), for the Steam Deck and any distribution
# without WebKitGTK 4.1; it replaces the Flatpak.
#
# Windows also gets a WebView2-bundled package (windows-x86_64-webview2) when a Fixed Version
# runtime is named: the repository variable WEBVIEW2_FIXED_URL, or the manual run's input
# (https://developer.microsoft.com/microsoft-edge/webview2/ -> Fixed Version, x64, a .cab;
# its links change each release). The runtime goes in webview2\ beside the program, which
# finds it there itself (main.rs, launch_env) - for machines without the system runtime
# (WebView2 removed with Edge, LTSC, stripped images). Windows 10 or later either way.

name: Build the app (Tauri)

on:
  workflow_dispatch:
    inputs:
      webview2_url:
        description: "WebView2 Fixed Version runtime .cab URL (x64) for the bundled-WebView2 Windows build; empty = the WEBVIEW2_FIXED_URL variable"
        required: false
        default: ""
      webview2_sha256:
        description: "SHA-256 of that .cab, which the build must match; empty = the WEBVIEW2_FIXED_SHA256 variable (unset: the build warns and prints the hash)"
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: ["build/**"]

permissions: {}

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write # attach to the Release on tag builds
      id-token: write # the build's provenance attestation (security audit F9)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: windows-x86_64
            exe: .exe
          - runner: ubuntu-22.04
            name: linux-x86_64
            exe: ""
          - runner: macos-15
            name: macos-arm64
            exe: ""
          - runner: macos-15-intel
            name: macos-x86_64
            exe: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A version, not `stable`: the same compiler until this line is changed (security audit F9). The
      # compiler is the branch this commit is the tip of: its action.yml fixes `toolchain: 1.100.0` and
      # takes no `toolchain` input (passing one only draws a warning on every job).
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # the 1.100.0 branch

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            viewer-shell/target
          key: cargo-app-${{ matrix.name }}-${{ hashFiles('viewer-shell/Cargo.lock') }}

      - name: Install WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config build-essential file

      - name: Build the program and the command line
        shell: bash
        run: |
          cp wraithguard_toolkit_icon.ico viewer-shell/icons/wraithguard_toolkit_icon.ico
          cargo build --release --locked --manifest-path viewer-shell/Cargo.toml
          cargo build --release --locked --manifest-path viewer-shell/cli/Cargo.toml
          cargo test --release --locked --manifest-path viewer-shell/cli/Cargo.toml

      - name: Package
        shell: bash
        run: |
          out=wraithguard-${{ matrix.name }}
          mkdir -p "$out"
          cp viewer-shell/target/release/wraithguard-toolkit${{ matrix.exe }} "$out/"
          cp viewer-shell/target/release/wraithguard${{ matrix.exe }} "$out/"
          cp QUICKSTART.md README.md MLOX_RULES.md CHANGELOG.md LICENSE CREDITS.md "$out/" 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$out.zip" "$out" >/dev/null; else tar czf "$out.tar.gz" "$out"; fi
          ls -lh "$out"

      # Provenance: a signed statement, tied to this repository, workflow and commit, of what was
      # built here (`gh attestation verify <file> --repo <owner>/<repo>`). GitHub gives
      # attestations to public repositories (and Enterprise ones), so a private build goes on without.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            wraithguard-${{ matrix.name }}.*
            viewer-shell/target/release/wraithguard-toolkit${{ matrix.exe }}
            viewer-shell/target/release/wraithguard${{ matrix.exe }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wraithguard-${{ matrix.name }}
          path: |
            wraithguard-${{ matrix.name }}.zip
            wraithguard-${{ matrix.name }}.tar.gz
          if-no-files-found: error

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Package step makes a .zip on Windows and a .tar.gz elsewhere, never both, so
          # pick the one it made (an `ls` of both exits 2 for the missing one, which fails the
          # step under bash's `-e -o pipefail`).
          if [ "$RUNNER_OS" = "Windows" ]; then f=wraithguard-${{ matrix.name }}.zip; else f=wraithguard-${{ matrix.name }}.tar.gz; fi
          test -f "$f"
          # The jobs of a matrix run at once: if the release does not exist yet they all try to create
          # it, and the ones that lose the race upload to the one that won.
          # The SHA-256 sum beside it (`sha256sum` on Windows' Git Bash and Linux, `shasum` on macOS), so a download can be
          # checked against a file the release carries (security audit 2026-11-20, F9).
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          gh release upload "${GITHUB_REF_NAME}" "$f" "$f.sha256" --clobber \
            || gh release create "${GITHUB_REF_NAME}" "$f" "$f.sha256" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" "$f" "$f.sha256" --clobber

  linux-appimage:
    # Linux and the Steam Deck: one AppImage (Tauri's bundler), WebKitGTK and GStreamer inside,
    # so it runs without the system's. Built on the oldest runner so its glibc is the oldest
    # the AppImage asks for. Started as an AppImage the program keeps its settings beside the
    # .AppImage file (viewcore::profiles), and its Help reads the documents it carries.
    permissions:
      contents: write # attach to the Release on tag builds
      id-token: write # the build's provenance attestation (security audit F9)
      attestations: write
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy is itself an AppImage: run it unpacked, no FUSE needed on the runner.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A version, not `stable`: the same compiler until this line is changed (security audit F9). The
      # compiler is the branch this commit is the tip of: its action.yml fixes `toolchain: 1.100.0` and
      # takes no `toolchain` input (passing one only draws a warning on every job).
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # the 1.100.0 branch

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            viewer-shell/target
          key: cargo-appimage-${{ hashFiles('viewer-shell/Cargo.lock') }}

      - name: Install WebKitGTK, GStreamer and the bundler's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config build-essential file \
            libfuse2 xdg-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: Build the AppImage
        shell: bash
        run: |
          cp wraithguard_toolkit_icon.ico viewer-shell/icons/wraithguard_toolkit_icon.ico
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked
          cd viewer-shell
          # build.rs assembles the page into ui-dist; the CLI looks for the folder before that.
          mkdir -p ui-dist
          cargo tauri build --bundles appimage
          f=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          test -f "$f"
          cp "$f" ../Wraithguard_Toolkit-x86_64.AppImage
          chmod +x ../Wraithguard_Toolkit-x86_64.AppImage
          ls -lh ../Wraithguard_Toolkit-x86_64.AppImage

      # Provenance: a signed statement, tied to this repository, workflow and commit, of what was
      # built here (`gh attestation verify <file> --repo <owner>/<repo>`). GitHub gives
      # attestations to public repositories (and Enterprise ones), so a private build goes on without.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            Wraithguard_Toolkit-x86_64.AppImage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Wraithguard_Toolkit-x86_64-appimage
          path: Wraithguard_Toolkit-x86_64.AppImage
          if-no-files-found: error

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=Wraithguard_Toolkit-x86_64.AppImage
          # The SHA-256 sum beside it (`sha256sum` on Windows' Git Bash and Linux, `shasum` on macOS), so a download can be
          # checked against a file the release carries (security audit 2026-11-20, F9).
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          gh release upload "${GITHUB_REF_NAME}" "$f" "$f.sha256" --clobber \
            || gh release create "${GITHUB_REF_NAME}" "$f" "$f.sha256" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" "$f" "$f.sha256" --clobber

  windows-webview2:
    # The Windows package again with the WebView2 Fixed Version runtime beside the program.
    if: ${{ inputs.webview2_url != '' || vars.WEBVIEW2_FIXED_URL != '' }}
    permissions:
      contents: write # attach to the Release on tag builds
      id-token: write # the build's provenance attestation (security audit F9)
      attestations: write
    runs-on: windows-latest
    env:
      WEBVIEW2_URL: ${{ inputs.webview2_url != '' && inputs.webview2_url || vars.WEBVIEW2_FIXED_URL }}
      WEBVIEW2_SHA256: ${{ inputs.webview2_sha256 != '' && inputs.webview2_sha256 || vars.WEBVIEW2_FIXED_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A version, not `stable`: the same compiler until this line is changed (security audit F9). The
      # compiler is the branch this commit is the tip of: its action.yml fixes `toolchain: 1.100.0` and
      # takes no `toolchain` input (passing one only draws a warning on every job).
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # the 1.100.0 branch

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            viewer-shell/target
          key: cargo-app-windows-x86_64-${{ hashFiles('viewer-shell/Cargo.lock') }}

      - name: Build the program and the command line
        shell: bash
        run: |
          cp wraithguard_toolkit_icon.ico viewer-shell/icons/wraithguard_toolkit_icon.ico
          cargo build --release --locked --manifest-path viewer-shell/Cargo.toml
          cargo build --release --locked --manifest-path viewer-shell/cli/Cargo.toml

      - name: Package with the WebView2 runtime
        # The .cab holds one folder, Microsoft.WebView2.FixedVersionRuntime.<ver>.x64, which
        # goes in webview2\ beside the program as it is.
        shell: pwsh
        run: |
          $out = "wraithguard-windows-x86_64-webview2"
          New-Item -ItemType Directory -Force -Path "$out/webview2" | Out-Null
          Copy-Item viewer-shell/target/release/wraithguard-toolkit.exe, viewer-shell/target/release/wraithguard.exe $out
          foreach ($f in "QUICKSTART.md","README.md","MLOX_RULES.md","CHANGELOG.md","CREDITS.md") { if (Test-Path $f) { Copy-Item $f $out } }
          if (-not $env:WEBVIEW2_URL.StartsWith("https://")) { throw "the WebView2 runtime URL must be https" }
          Invoke-WebRequest -Uri $env:WEBVIEW2_URL -OutFile webview2.cab
          # Pin it: the repository variable WEBVIEW2_FIXED_SHA256 (or the manual run's input) is the
          # SHA-256 of the .cab this build may bundle. The hash is always printed, to pin it from.
          $got = (Get-FileHash webview2.cab -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "WebView2 .cab sha256: $got"
          if ($env:WEBVIEW2_SHA256) {
            if ($got -ne $env:WEBVIEW2_SHA256.Trim().ToLowerInvariant()) { throw "the WebView2 .cab does not match WEBVIEW2_FIXED_SHA256 ($got)" }
          } else {
            Write-Warning "WEBVIEW2_FIXED_SHA256 is not set: the bundled runtime is not pinned"
          }
          expand.exe webview2.cab -F:* "$out/webview2" | Out-Null
          $exe = Get-ChildItem -Path "$out/webview2" -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
          if (-not $exe) { throw "no msedgewebview2.exe in the downloaded runtime" }
          Write-Host "bundled WebView2: $($exe.DirectoryName)"
          Compress-Archive -Path "$out" -DestinationPath "$out.zip"

      # Provenance: a signed statement, tied to this repository, workflow and commit, of what was
      # built here (`gh attestation verify <file> --repo <owner>/<repo>`). GitHub gives
      # attestations to public repositories (and Enterprise ones), so a private build goes on without.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            wraithguard-windows-x86_64-webview2.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wraithguard-windows-x86_64-webview2
          path: wraithguard-windows-x86_64-webview2.zip
          if-no-files-found: error

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=wraithguard-windows-x86_64-webview2.zip
          # The jobs of a matrix run at once: if the release does not exist yet they all try to create
          # it, and the ones that lose the race upload to the one that won.
          # The SHA-256 sum beside it (`sha256sum` on Windows' Git Bash and Linux, `shasum` on macOS), so a download can be
          # checked against a file the release carries (security audit 2026-11-20, F9).
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          gh release upload "${GITHUB_REF_NAME}" "$f" "$f.sha256" --clobber \
            || gh release create "${GITHUB_REF_NAME}" "$f" "$f.sha256" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" "$f" "$f.sha256" --clobber
