# The program without Python (port step 4.5, slice 5; viewer-shell/DROP-TK.md): one Tauri
# build per platform. Each package holds
#
#   wraithguard-toolkit   the program: started on its own it opens on the settings file's
#                        openmw.cfg, or on its Setup page (no Python, no Tk)
#   wraithguard          the command line (viewer-shell/cli): the sort, export and scans
#   QUICKSTART.md ...    the documents its Help page shows
#
# The only release build since 5.0 (the PyInstaller builds went with the Python app).
#
# Linux also gets an AppImage (linux-appimage below), for the Steam Deck and any distribution
# without WebKitGTK 4.1; it replaces the Flatpak.
#
# Windows also gets a WebView2-bundled package (windows-x86_64-webview2) when a Fixed Version
# runtime is named: the repository variable WEBVIEW2_FIXED_URL, or the manual run's input
# (https://developer.microsoft.com/microsoft-edge/webview2/ -> Fixed Version, x64, a .cab;
# its links change each release). The runtime goes in webview2\ beside the program, which
# finds it there itself (main.rs, launch_env) - for machines without the system runtime
# (WebView2 removed with Edge, LTSC, stripped images). Windows 10 or later either way.

name: Build the app (Tauri)

on:
  workflow_dispatch:
    inputs:
      webview2_url:
        description: "WebView2 Fixed Version runtime .cab URL (x64) for the bundled-WebView2 Windows build; empty = the WEBVIEW2_FIXED_URL variable"
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: ["build/**"]

permissions: {}

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write # attach to the Release on tag builds
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: windows-x86_64
            exe: .exe
          - runner: ubuntu-22.04
            name: linux-x86_64
            exe: ""
          - runner: macos-15
            name: macos-arm64
            exe: ""
          - runner: macos-15-intel
            name: macos-x86_64
            exe: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch
        with:
          toolchain: stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            viewer-shell/target
            viewer-shell/cli/target
          key: cargo-app-${{ matrix.name }}-${{ hashFiles('viewer-shell/Cargo.lock', 'viewer-shell/cli/Cargo.lock') }}

      - name: Install WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config build-essential file

      - name: Build the program and the command line
        shell: bash
        run: |
          cp wraithguard_toolkit_icon.ico viewer-shell/icons/wraithguard_toolkit_icon.ico
          cargo build --release --manifest-path viewer-shell/Cargo.toml
          cargo build --release --manifest-path viewer-shell/cli/Cargo.toml
          cargo test --release --manifest-path viewer-shell/cli/Cargo.toml

      - name: Package
        shell: bash
        run: |
          out=wraithguard-${{ matrix.name }}
          mkdir -p "$out"
          cp viewer-shell/target/release/wraithguard-toolkit${{ matrix.exe }} "$out/"
          cp viewer-shell/cli/target/release/wraithguard${{ matrix.exe }} "$out/"
          cp QUICKSTART.md README.md MLOX_RULES.md CHANGELOG.md LICENSE CREDITS.md "$out/" 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$out.zip" "$out" >/dev/null; else tar czf "$out.tar.gz" "$out"; fi
          ls -lh "$out"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wraithguard-${{ matrix.name }}
          path: |
            wraithguard-${{ matrix.name }}.zip
            wraithguard-${{ matrix.name }}.tar.gz
          if-no-files-found: error

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Package step makes a .zip on Windows and a .tar.gz elsewhere, never both, so
          # pick the one it made (an `ls` of both exits 2 for the missing one, which fails the
          # step under bash's `-e -o pipefail`).
          if [ "$RUNNER_OS" = "Windows" ]; then f=wraithguard-${{ matrix.name }}.zip; else f=wraithguard-${{ matrix.name }}.tar.gz; fi
          test -f "$f"
          # The jobs of a matrix run at once: if the release does not exist yet they all try to create
          # it, and the ones that lose the race upload to the one that won.
          gh release upload "${GITHUB_REF_NAME}" "$f" --clobber \
            || gh release create "${GITHUB_REF_NAME}" "$f" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" "$f" --clobber

  linux-appimage:
    # Linux and the Steam Deck: one AppImage (Tauri's bundler), WebKitGTK and GStreamer inside,
    # so it runs without the system's. Built on the oldest runner so its glibc is the oldest
    # the AppImage asks for. Started as an AppImage the program keeps its settings beside the
    # .AppImage file (viewcore::profiles), and its Help reads the documents it carries.
    permissions:
      contents: write # attach to the Release on tag builds
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy is itself an AppImage: run it unpacked, no FUSE needed on the runner.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch
        with:
          toolchain: stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            viewer-shell/target
          key: cargo-appimage-${{ hashFiles('viewer-shell/Cargo.lock') }}

      - name: Install WebKitGTK, GStreamer and the bundler's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config build-essential file \
            libfuse2 xdg-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: Build the AppImage
        shell: bash
        run: |
          cp wraithguard_toolkit_icon.ico viewer-shell/icons/wraithguard_toolkit_icon.ico
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked
          cd viewer-shell
          # build.rs assembles the page into ui-dist; the CLI looks for the folder before that.
          mkdir -p ui-dist
          cargo tauri build --bundles appimage
          f=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          test -f "$f"
          cp "$f" ../wraithguard-linux-x86_64.AppImage
          chmod +x ../wraithguard-linux-x86_64.AppImage
          ls -lh ../wraithguard-linux-x86_64.AppImage

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wraithguard-linux-x86_64-appimage
          path: wraithguard-linux-x86_64.AppImage
          if-no-files-found: error

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=wraithguard-linux-x86_64.AppImage
          gh release upload "${GITHUB_REF_NAME}" "$f" --clobber \
            || gh release create "${GITHUB_REF_NAME}" "$f" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" "$f" --clobber

  windows-webview2:
    # The Windows package again with the WebView2 Fixed Version runtime beside the program.
    if: ${{ inputs.webview2_url != '' || vars.WEBVIEW2_FIXED_URL != '' }}
    permissions:
      contents: write # attach to the Release on tag builds
    runs-on: windows-latest
    env:
      WEBVIEW2_URL: ${{ inputs.webview2_url != '' && inputs.webview2_url || vars.WEBVIEW2_FIXED_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch
        with:
          toolchain: stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            viewer-shell/target
            viewer-shell/cli/target
          key: cargo-app-windows-x86_64-${{ hashFiles('viewer-shell/Cargo.lock', 'viewer-shell/cli/Cargo.lock') }}

      - name: Build the program and the command line
        shell: bash
        run: |
          cp wraithguard_toolkit_icon.ico viewer-shell/icons/wraithguard_toolkit_icon.ico
          cargo build --release --manifest-path viewer-shell/Cargo.toml
          cargo build --release --manifest-path viewer-shell/cli/Cargo.toml

      - name: Package with the WebView2 runtime
        # The .cab holds one folder, Microsoft.WebView2.FixedVersionRuntime.<ver>.x64, which
        # goes in webview2\ beside the program as it is.
        shell: pwsh
        run: |
          $out = "wraithguard-windows-x86_64-webview2"
          New-Item -ItemType Directory -Force -Path "$out/webview2" | Out-Null
          Copy-Item viewer-shell/target/release/wraithguard-toolkit.exe, viewer-shell/cli/target/release/wraithguard.exe $out
          foreach ($f in "QUICKSTART.md","README.md","MLOX_RULES.md","CHANGELOG.md","CREDITS.md") { if (Test-Path $f) { Copy-Item $f $out } }
          Invoke-WebRequest -Uri $env:WEBVIEW2_URL -OutFile webview2.cab
          expand.exe webview2.cab -F:* "$out/webview2" | Out-Null
          $exe = Get-ChildItem -Path "$out/webview2" -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
          if (-not $exe) { throw "no msedgewebview2.exe in the downloaded runtime" }
          Write-Host "bundled WebView2: $($exe.DirectoryName)"
          Compress-Archive -Path "$out" -DestinationPath "$out.zip"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wraithguard-windows-x86_64-webview2
          path: wraithguard-windows-x86_64-webview2.zip
          if-no-files-found: error

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=wraithguard-windows-x86_64-webview2.zip
          # The jobs of a matrix run at once: if the release does not exist yet they all try to create
          # it, and the ones that lose the race upload to the one that won.
          gh release upload "${GITHUB_REF_NAME}" "$f" --clobber \
            || gh release create "${GITHUB_REF_NAME}" "$f" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
