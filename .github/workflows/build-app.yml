# The program without Python (port step 4.5, slice 5; viewer-shell/DROP-TK.md): one Tauri
# build per platform. Each package holds
#
#   wraithguard-viewer   the program: started on its own it opens on the settings file's
#                        openmw.cfg, or on its Setup page (no Python, no Tk)
#   wraithguard          the command line (viewer-shell/cli): the sort, export and scans
#   QUICKSTART.md ...    the documents its Help page shows
#
# The only release build since 5.0 (the PyInstaller builds went with the Python app).
#
# Windows also gets a WebView2-bundled package (windows-x86_64-webview2) when a Fixed Version
# runtime is named: the repository variable WEBVIEW2_FIXED_URL, or the manual run's input
# (https://developer.microsoft.com/microsoft-edge/webview2/ -> Fixed Version, x64, a .cab;
# its links change each release). The runtime goes in webview2\ beside the program, which
# finds it there itself (main.rs, launch_env) - for machines without the system runtime
# (WebView2 removed with Edge, LTSC, stripped images). Windows 10 or later either way.

name: Build the app (Tauri)

on:
  workflow_dispatch:
    inputs:
      webview2_url:
        description: "WebView2 Fixed Version runtime .cab URL (x64) for the bundled-WebView2 Windows build; empty = the WEBVIEW2_FIXED_URL variable"
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: ["build/**"]

permissions: {}

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write # attach to the Release on tag builds
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: windows-x86_64
            exe: .exe
          - runner: ubuntu-22.04
            name: linux-x86_64
            exe: ""
          - runner: macos-14
            name: macos-arm64
            exe: ""
          - runner: macos-15-intel
            name: macos-x86_64
            exe: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch
        with:
          toolchain: stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            viewer-shell/target
            viewer-shell/cli/target
          key: cargo-app-${{ matrix.name }}-${{ hashFiles('viewer-shell/Cargo.lock', 'viewer-shell/cli/Cargo.lock') }}

      - name: Install WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config build-essential file

      - name: Build the program and the command line
        shell: bash
        run: |
          cp wraithguard_toolkit_icon.ico viewer-shell/icons/wraithguard_toolkit_icon.ico
          cargo build --release --manifest-path viewer-shell/Cargo.toml
          cargo build --release --manifest-path viewer-shell/cli/Cargo.toml
          cargo test --release --manifest-path viewer-shell/cli/Cargo.toml

      - name: Package
        shell: bash
        run: |
          out=wraithguard-${{ matrix.name }}
          mkdir -p "$out"
          cp viewer-shell/target/release/wraithguard-viewer${{ matrix.exe }} "$out/"
          cp viewer-shell/cli/target/release/wraithguard${{ matrix.exe }} "$out/"
          cp QUICKSTART.md README.md MLOX_RULES.md CHANGELOG.md LICENSE CREDITS.md "$out/" 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$out.zip" "$out" >/dev/null; else tar czf "$out.tar.gz" "$out"; fi
          ls -lh "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wraithguard-${{ matrix.name }}
          path: |
            wraithguard-${{ matrix.name }}.zip
            wraithguard-${{ matrix.name }}.tar.gz
          if-no-files-found: error

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls wraithguard-${{ matrix.name }}.zip wraithguard-${{ matrix.name }}.tar.gz 2>/dev/null | head -1)
          gh release upload "${GITHUB_REF_NAME}" "$f" --clobber || gh release create "${GITHUB_REF_NAME}" "$f" --generate-notes

  windows-webview2:
    # The Windows package again with the WebView2 Fixed Version runtime beside the program.
    if: ${{ inputs.webview2_url != '' || vars.WEBVIEW2_FIXED_URL != '' }}
    permissions:
      contents: write # attach to the Release on tag builds
    runs-on: windows-latest
    env:
      WEBVIEW2_URL: ${{ inputs.webview2_url != '' && inputs.webview2_url || vars.WEBVIEW2_FIXED_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch
        with:
          toolchain: stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            viewer-shell/target
            viewer-shell/cli/target
          key: cargo-app-windows-x86_64-${{ hashFiles('viewer-shell/Cargo.lock', 'viewer-shell/cli/Cargo.lock') }}

      - name: Build the program and the command line
        shell: bash
        run: |
          cp wraithguard_toolkit_icon.ico viewer-shell/icons/wraithguard_toolkit_icon.ico
          cargo build --release --manifest-path viewer-shell/Cargo.toml
          cargo build --release --manifest-path viewer-shell/cli/Cargo.toml

      - name: Package with the WebView2 runtime
        # The .cab holds one folder, Microsoft.WebView2.FixedVersionRuntime.<ver>.x64, which
        # goes in webview2\ beside the program as it is.
        shell: pwsh
        run: |
          $out = "wraithguard-windows-x86_64-webview2"
          New-Item -ItemType Directory -Force -Path "$out/webview2" | Out-Null
          Copy-Item viewer-shell/target/release/wraithguard-viewer.exe, viewer-shell/cli/target/release/wraithguard.exe $out
          foreach ($f in "QUICKSTART.md","README.md","MLOX_RULES.md","CHANGELOG.md","CREDITS.md") { if (Test-Path $f) { Copy-Item $f $out } }
          Invoke-WebRequest -Uri $env:WEBVIEW2_URL -OutFile webview2.cab
          expand.exe webview2.cab -F:* "$out/webview2" | Out-Null
          $exe = Get-ChildItem -Path "$out/webview2" -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
          if (-not $exe) { throw "no msedgewebview2.exe in the downloaded runtime" }
          Write-Host "bundled WebView2: $($exe.DirectoryName)"
          Compress-Archive -Path "$out" -DestinationPath "$out.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wraithguard-windows-x86_64-webview2
          path: wraithguard-windows-x86_64-webview2.zip
          if-no-files-found: error

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=wraithguard-windows-x86_64-webview2.zip
          gh release upload "${GITHUB_REF_NAME}" "$f" --clobber || gh release create "${GITHUB_REF_NAME}" "$f" --generate-notes
