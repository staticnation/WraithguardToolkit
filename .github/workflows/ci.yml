# Continuous integration (5.0: the program is Rust and the page only; the Python app,
# its PyInstaller builds and native/ were retired - viewer-shell/DROP-TK.md slice 8).
#
# The crates' tests, Clippy, the command layer compiled without Tauri's native tree, and
# the page booted in jsdom against the real commands. Hermetic: no network, nothing
# outside the repo.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same branch supersedes an in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cell-viewer:
    # The cell viewer, checked without Tauri's native tree (no WebKitGTK on the runner
    # needed): the engine's tests, the command layer compiled against a Tauri stub
    # (check-commands), the shell's URL mode against its stub (check), and the page
    # booted against the real commands.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # nothing here pushes; the token is not left in .git
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch
        with:
          toolchain: stable
          components: clippy
      - name: viewcore tests
        run: cargo test --manifest-path viewer-shell/viewcore/Cargo.toml
      - name: luacore tests
        run: cargo test --features teal --manifest-path viewer-shell/luacore/Cargo.toml
      # The openmw.cfg reader, against the shared cases
      # (tests/fixtures/openmw_cfg_cases.json).
      - name: ordercore tests
        run: cargo test --manifest-path viewer-shell/ordercore/Cargo.toml
      # The Wraithguard ports the viewer's pages answer from (port steps 4.1-4.4): the Editor's
      # backend, the Conflicts page, the Tools page and the landscape (Merge Settings).
      - name: editcore, conflictcore, toolscore and landcore tests
        run: |
          set -e
          cargo test --manifest-path viewer-shell/editcore/Cargo.toml
          cargo test --manifest-path viewer-shell/conflictcore/Cargo.toml
          cargo test --manifest-path viewer-shell/toolscore/Cargo.toml
          cargo test --manifest-path viewer-shell/landcore/Cargo.toml
      # The command line (port step 4.5, slice 1): the wraithguard binary run on the cases the
      # retired Python CLI answered (tests/fixtures/cli_cases.json).
      - name: command line tests
        run: cargo test --manifest-path viewer-shell/cli/Cargo.toml
      # Greatness7's tes3 crate against Gardenfell's readers, record for record and mesh
      # for mesh (tests/differential*.rs), and our tests inside the vendored crates
      # (patches 0004, 0007, 0008). Robin's own suite is not run here: 32 of its tests
      # read his generated fixture, which is not in our repository (VENDOR.md).
      - name: gardenfell-g7 and the carried patches
        run: |
          set -e
          cargo test --manifest-path viewer-shell/gardenfell-g7/Cargo.toml
          cargo test --manifest-path viewer-shell/gardenfell/Cargo.toml -p gardenfell-world --test wraithguard
          cargo test --manifest-path viewer-shell/gardenfell/Cargo.toml -p gardenfell-install --test wraithguard_weather
          cargo test --manifest-path viewer-shell/gardenfell/Cargo.toml -p gardenfell-bsa --test wraithguard_bsa
          cargo test --manifest-path viewer-shell/gardenfell/Cargo.toml -p gardenfell-install --test wraithguard_providers
          cargo test --manifest-path viewer-shell/gardenfell/Cargo.toml -p gardenfell-nif --lib
      # meshoptimizer's vertex fetch order and analysers, ported (beside Gardenfell's
      # triorder), against the C++'s own values (tests/oracle_values.tsv).
      - name: meshopt-port tests
        run: cargo test --manifest-path viewer-shell/meshopt-port/Cargo.toml
      # Clippy on our own crates (not the forks or dependencies), strict: a warning fails
      # the job. The style lints this code base has chosen not to follow are allowed in
      # each crate's Cargo.toml ([lints.clippy]), with the reason beside each. The viewer
      # shell itself needs WebKitGTK, which this runner does not install; check-commands
      # compiles the same command code without it (tools/build_and_check_rust.ps1 covers
      # the shell locally).
      - name: clippy
        run: |
          set -e
          for m in viewer-shell/luacore/Cargo.toml viewer-shell/ordercore/Cargo.toml viewer-shell/editcore/Cargo.toml viewer-shell/conflictcore/Cargo.toml viewer-shell/toolscore/Cargo.toml viewer-shell/landcore/Cargo.toml viewer-shell/cli/Cargo.toml viewer-shell/gardenfell-g7/Cargo.toml viewer-shell/meshopt-port/Cargo.toml viewer-shell/viewcore/Cargo.toml viewer-shell/check-commands/Cargo.toml; do
            echo "::group::clippy $m"
            cargo clippy --all-targets --manifest-path "$m" -- -D warnings
            echo "::endgroup::"
          done
      - name: command layer compiles
        run: cargo build --manifest-path viewer-shell/check-commands/Cargo.toml
      - name: shell URL mode compiles
        run: cargo build --manifest-path viewer-shell/check/Cargo.toml
      # The page itself, booted in jsdom against the real command bodies (the headless
      # `wg-view-serve` engine): connects the fixture setup, loads a cell, opens ORI on
      # an object, and fails on any page error.
      - name: headless engine
        run: cargo build --release --manifest-path viewer-shell/check-commands/Cargo.toml --bin wg-view-serve
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install viewer test dependencies
        working-directory: viewer-shell/ui/tests
        run: npm ci --no-audit --no-fund
      - name: preview loading races
        working-directory: viewer-shell/ui/tests
        run: npm run preview
      - name: cell viewer boots
        working-directory: viewer-shell/ui/tests
        run: node boot.js
      # And the mesh viewer: files only (no cell work), both copies drawn, normal map found.
      - name: mesh viewer boots
        working-directory: viewer-shell/ui/tests
        run: WG_MESH_VIEW=1 node boot.js
      # And the program on its own with no openmw.cfg yet: the Setup page opens, checks,
      # saves and loads (port step 4.5).
      - name: first start opens Setup
        working-directory: viewer-shell/ui/tests
        run: WG_SETUP=1 node boot.js
      # The Editor's windows on their own (editor/*.test.js), the engine and Wraithguard
      # answered by the tests: drags, searches, menus, the path grid and navmesh tools.
      - name: editor windows
        working-directory: viewer-shell/ui/tests
        run: node editor/run.js
