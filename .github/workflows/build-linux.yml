# Build the Linux AppImage and upload it as an artifact (and a release asset on tags).
#
# One self-contained AppImage: the toolkit, its viewer shell, and WebKitGTK with its
# whole dependency tree (packaging/linux/build-appimage.sh), so it runs on machines
# with no WebKitGTK of their own - the Steam Deck's SteamOS ships none. The earlier
# Docker build copied the viewer into the PyInstaller bundle as a bare ELF with none
# of the ~70 shared libraries it needs, which is why it could not start on a Deck.
#
# Built on Ubuntu 22.04 on purpose: an AppImage runs where the build machine's glibc
# runs, and 22.04's 2.35 is older than any current SteamOS; it also has
# libwebkit2gtk-4.1 (Tauri v2's WebKit).

name: Build Linux app

on:
  workflow_dispatch:
  push:
    # A `v*` tag cuts a release (Release/sign steps are tag-gated). A `build/**`
    # branch is a dry run: it builds and uploads the AppImage as an artifact but
    # attaches nothing.
    tags: ["v*"]
    branches: ["build/**"]

permissions:
  contents: write # create/attach to a Release on tag builds

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        # Tauri v2's Linux build prerequisites (webkit2gtk-4.1), Tk for the toolkit,
        # and what the AppImage step uses (file for linuxdeploy, wget).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config build-essential \
            file wget tk-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            viewer-shell/target
          key: cargo-linux-${{ hashFiles('viewer-shell/Cargo.lock') }}

      - name: Build the viewer shell
        run: |
          cd viewer-shell
          cargo build --release
          ls -lh target/release/wraithguard-viewer

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
          allow-prereleases: true
          cache: pip

      - name: Verify the free-threaded build
        run: |
          python --version
          python -c "import sys; assert not sys._is_gil_enabled(), 'GIL is enabled -- not a free-threaded build'; print('free-threaded OK')"

      - name: Install build dependencies
        # Pillow only for the AppImage icon (build time); the app does not import it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterweb tkinterdnd2 PyYAML ijson certifi pillow

      - name: Build the Rust backend (native/, greatness7's tes3 crates)
        run: python -m pip install ./native

      - name: Build the toolkit (PyInstaller, one folder)
        # --onedir, not --onefile: the AppImage is the single file, and a onefile
        # inside it would unpack itself to /tmp on every start. The viewer is not
        # added here - it lives in the AppImage beside its WebKit (AppRun names it).
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name wraithguard_toolkit_gui \
            --icon wraithguard_toolkit_icon.ico \
            --collect-submodules wraithguard \
            --hidden-import wraithguard_native \
            --collect-all certifi \
            --hidden-import tkinterweb \
            --add-data "wraithguard_toolkit.py:." \
            --add-data "README.md:." \
            --add-data "QUICKSTART.md:." \
            --add-data "MLOX_RULES.md:." \
            --add-data "CREDITS.md:." \
            --add-data "License:License" \
            --add-data "viewer-shell/ui/LICENSE:License/viewer-page" \
            --add-data "wraithguard_toolkit_icon.ico:." \
            --add-data "wraithguard/viz/assets:assets" \
            wraithguard_toolkit_gui.py

      - name: Build the AppImage
        run: bash packaging/linux/build-appimage.sh

      - name: Check it is self-contained
        # The viewer's libraries must all resolve inside the AppImage: anything
        # ldd finds only on the host is something a Steam Deck will not have.
        run: |
          cd dist
          ./Wraithguard-x86_64.AppImage --appimage-extract >/dev/null
          deps=$(LD_LIBRARY_PATH= ldd squashfs-root/usr/bin/wraithguard-viewer)
          echo "$deps"
          ! echo "$deps" | grep -q 'not found'
          # The host has WebKit installed too, so "found" is not enough: these must be
          # the AppImage's own copies.
          for lib in libwebkit2gtk-4.1 libjavascriptcoregtk-4.1 libgtk-3 libsoup-3; do
            echo "$deps" | grep "$lib" | grep -q squashfs-root || { echo "$lib resolves outside the AppImage"; exit 1; }
          done
          # Every check says what failed: a bare `test` ends the step with no reason.
          test -x squashfs-root/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitWebProcess \
            || { echo "WebKitWebProcess missing:"; ls -la squashfs-root/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/ || true; exit 1; }
          # ...and the graphics stack must be the host's (the Deck's EGL_BAD_PARAMETER),
          # started through the launcher that retries without it.
          stray=$(find squashfs-root/usr/lib \( -name 'libEGL*.so*' -o -name 'libGL*.so*' -o -name 'libgbm.so*' -o -name 'libdrm*.so*' -o -name 'libwayland-*.so*' -o -name 'libstdc++.so*' -o -name 'libgcc_s.so*' \) -print)
          [ -z "$stray" ] || { echo "graphics libraries bundled: $stray"; exit 1; }
          test -x squashfs-root/usr/bin/wraithguard-viewer-run \
            || { echo "launcher missing or not executable:"; ls -la squashfs-root/usr/bin/; exit 1; }
          # linuxdeploy wraps our AppRun in its own (which loads the GTK hook, then runs
          # AppRun.wrapped) whenever an apprun-hooks folder exists, so ours may be either.
          grep -qs wraithguard-viewer-run squashfs-root/AppRun squashfs-root/AppRun.wrapped \
            || { echo "AppRun does not start the launcher:"; ls -la squashfs-root/AppRun*; head -40 squashfs-root/AppRun* || true; exit 1; }
          echo "self-contained: OK"
          rm -rf squashfs-root

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: wraithguard-toolkit-linux-x86_64-appimage
          path: dist/Wraithguard-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Name it for the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: cp dist/Wraithguard-x86_64.AppImage dist/wraithguard-toolkit-linux-x86_64.AppImage

      - name: Publish the release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wraithguard-toolkit-linux-x86_64.AppImage
          fail_on_unmatched_files: false
          # This single-run job is the sole owner of the release notes: the Windows
          # and macOS build steps deliberately omit generate_release_notes because
          # they are matrixed and each set call appends another "Full Changelog"
          # block to the shared release. Keeping it here (and only here) yields one
          # changelog. If this job is ever matrixed, move note generation to a
          # dedicated release job so it still fires exactly once.
          generate_release_notes: true
