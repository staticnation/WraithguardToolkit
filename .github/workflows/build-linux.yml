# Build the plain Linux app and upload it as an artifact (and a release asset on tags).
#
# One PyInstaller binary (build/pyinstaller.txt's command) and the viewer shell beside
# it, in a .tar.gz - nothing of the system's carried along. The viewer runs on
# the machine's own WebKitGTK 4.1 (libwebkit2gtk-4.1: Ubuntu 22.04+, Debian 12+,
# Fedora, Arch), so a distro that has it gets its own GTK, Mesa and C++ runtime,
# matched to each other. The Steam Deck's
# SteamOS ships no WebKitGTK: its build is the Flatpak (build-flatpak.yml).
#
# This replaced the AppImage, which carried WebKitGTK and its ~70 libraries with it:
# every one the host also had could shadow the host's copy, and on the Deck they did
# (EGL_BAD_PARAMETER from Mesa, an undefined readline symbol in /bin/sh).
#
# Built on Ubuntu 22.04 on purpose: the build runs where the build machine's glibc
# runs, and 22.04's 2.35 is older than any current distro; it also has
# libwebkit2gtk-4.1 (Tauri v2's WebKit) to build the viewer against.

name: Build Linux app

on:
  workflow_dispatch:
  push:
    # A `v*` tag cuts a release (Release steps are tag-gated). A `build/**` branch is a
    # dry run: it builds and uploads the archive as an artifact but attaches nothing.
    tags: ["v*"]
    branches: ["build/**"]

permissions:
  contents: write # create/attach to a Release on tag builds

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        # Tauri v2's Linux build prerequisites (webkit2gtk-4.1) and Tk for the toolkit.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config build-essential \
            file tk-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            viewer-shell/target
          key: cargo-linux-${{ hashFiles('viewer-shell/Cargo.lock') }}

      - name: Build the viewer shell
        run: |
          cd viewer-shell
          cargo build --release
          ls -lh target/release/wraithguard-viewer

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
          allow-prereleases: true
          cache: pip

      - name: Verify the free-threaded build
        run: |
          python --version
          python -c "import sys; assert not sys._is_gil_enabled(), 'GIL is enabled -- not a free-threaded build'; print('free-threaded OK')"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterweb tkinterdnd2 PyYAML ijson certifi

      - name: Build the Rust backend (native/, greatness7's tes3 crates)
        run: python -m pip install ./native

      - name: Build the toolkit (PyInstaller, one file)
        # build/pyinstaller.txt's release command, with Linux's ':' separators and
        # WITHOUT the viewer: PyInstaller 6 recognises an executable even when it is
        # added as data, and then collects its whole dependency tree (WebKitGTK, GTK,
        # libsoup, libgbm - the run that tried it). The viewer ships beside the toolkit
        # in the archive instead (Pack it), where wraithguard/viewer_launch.py finds it
        # (the frozen app's own folder), and runs on the machine's own WebKitGTK.
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx \
            --name wraithguard_toolkit_gui \
            --icon wraithguard_toolkit_icon.ico \
            --collect-submodules wraithguard \
            --hidden-import wraithguard_native \
            --collect-all certifi \
            --hidden-import tkinterweb \
            --add-data "wraithguard_toolkit.py:." \
            --add-data "README.md:." \
            --add-data "QUICKSTART.md:." \
            --add-data "MLOX_RULES.md:." \
            --add-data "CREDITS.md:." \
            --add-data "License:License" \
            --add-data "viewer-shell/ui/LICENSE:License/viewer-page" \
            --add-data "wraithguard_toolkit_icon.ico:." \
            --add-data "wraithguard/viz/assets:assets" \
            wraithguard_toolkit_gui.py

      - name: Check it carries nothing of the system's
        # The viewer must take WebKitGTK, GTK and the graphics stack from the machine it
        # runs on, and nothing in the bundle may stand in for them.
        run: |
          deps=$(LD_LIBRARY_PATH= ldd viewer-shell/target/release/wraithguard-viewer)
          echo "$deps"
          ! echo "$deps" | grep -q 'not found' || { echo "the viewer has unresolved libraries"; exit 1; }
          # The bundle's table of contents through PyInstaller's own reader (the
          # pyi-archive_viewer command line changes between releases; this does not).
          python - <<'PY'
          import re, sys
          from PyInstaller.archive.readers import CArchiveReader
          names = [str(n) for n in CArchiveReader("dist/wraithguard_toolkit_gui").toc]
          print(f"{len(names)} entries in the bundle")
          pat =re.compile(r"(^|/)lib(webkit2gtk|javascriptcoregtk|gtk-3|gdk-3|soup-3|EGL|GL|gbm|drm|wayland-)")
          stray = sorted(n for n in names if pat.search(n))
          if stray:
              sys.exit("bundled system libraries:\n  " + "\n  ".join(stray))
          print("plain build: OK")
          PY

      - name: Pack it
        # The toolkit and the viewer side by side in a .tar.gz, which keeps their
        # executable bits (a bare file downloaded from a Release page loses it).
        run: |
          mkdir -p dist/pack
          install -m755 dist/wraithguard_toolkit_gui dist/pack/wraithguard-toolkit
          install -m755 viewer-shell/target/release/wraithguard-viewer dist/pack/wraithguard-viewer
          tar -C dist/pack -czf dist/wraithguard-toolkit-linux-x86_64.tar.gz wraithguard-toolkit wraithguard-viewer
          tar -tzvf dist/wraithguard-toolkit-linux-x86_64.tar.gz
          ls -lh dist/wraithguard-toolkit-linux-x86_64.tar.gz

      - name: Upload the build
        # The archive itself (`archive: false`, upload-artifact v7), not zipped again.
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/wraithguard-toolkit-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish the release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wraithguard-toolkit-linux-x86_64.tar.gz
          fail_on_unmatched_files: false
          # This single-run job is the sole owner of the release notes: the Windows,
          # macOS and Flatpak build steps deliberately omit generate_release_notes
          # because each set call appends another "Full Changelog" block to the shared
          # release. Keeping it here (and only here) yields one changelog. If this job
          # is ever matrixed, move note generation to a dedicated release job so it
          # still fires exactly once.
          generate_release_notes: true
