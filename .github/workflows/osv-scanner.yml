# OSV-Scanner (Google): every lock file in the repository (the workspace's Cargo.lock, the
# vendored Gardenfell's, the page tests' package-lock.json) against the OSV database, which carries the RustSec advisories
# cargo audit reads plus GitHub's and npm's. Results go to the Security tab (Code scanning).
# Crates from git (the [patch] forks: tes3, merge_to_master, gtk-0.18-patches) are not
# checked by it, nor by cargo audit: watch their upstreams by hand.

name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "53 5 * * 1"   # Mondays, 05:53 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
      permissions:
      actions: read
      contents: read
      security-events: write   # uploads the SARIF
    with:
      scan-args: |-
        -r
        ./
