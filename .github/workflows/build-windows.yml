# Autobuild the Windows builds and upload them as artifacts.
#
# The in-app viewer window is wraithguard-viewer, a standalone Rust/Tauri binary
# (see viewer-shell/), built here and bundled with the app. It draws with WebView2.
# Two variants:
#
#   system    one .exe; uses the WebView2 runtime Windows 10/11 ship with. Small.
#   webview2  a zipped folder that carries its own WebView2 (the Fixed Version
#             runtime - Chromium) in webview2/, for machines without the system
#             runtime: WebView2 removed along with Edge, or a Windows install that
#             never had it (LTSC, stripped images). wraithguard/viewer_launch.py
#             points the viewer at it (WEBVIEW2_BROWSER_EXECUTABLE_FOLDER). A folder,
#             not a one-file .exe, because a one-file build would unpack the ~250 MB
#             runtime on every start.
#
# The Fixed Version runtime is downloaded from Microsoft
# (https://developer.microsoft.com/microsoft-edge/webview2/ -> Fixed Version, x64,
# a .cab). Its download links change with every release, so the link is a repository
# variable, WEBVIEW2_FIXED_URL (or the manual run's input); the webview2 variant is
# built only when one is set. Note: Rust's Windows target needs Windows 10 or later,
# so neither variant runs on Windows 7/8.1 whatever WebView2 it carries.

name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      webview2_url:
        description: "WebView2 Fixed Version runtime .cab URL (x64) for the bundled-WebView2 build; empty = the WEBVIEW2_FIXED_URL variable"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write # create/attach to a Release on tag builds

# Exposed at workflow level so the sign step's `if:` can test whether the key is
# configured. The `secrets` context is NOT allowed in an `if:` expression, but
# `env` is -- so the secret is surfaced here and tested as `env.MINISIGN_SECRET_KEY`.
env:
  MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The bundled-WebView2 variant only when there is a runtime to bundle.
        variant: ${{ fromJSON((inputs.webview2_url != '' || vars.WEBVIEW2_FIXED_URL != '') && '["system","webview2"]' || '["system"]') }}
    env:
      WEBVIEW2_URL: ${{ inputs.webview2_url != '' && inputs.webview2_url || vars.WEBVIEW2_FIXED_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            viewer-shell/target
          key: cargo-windows-${{ hashFiles('viewer-shell/Cargo.lock') }}

      - name: Build the viewer shell
        # wraithguard-viewer.exe -- the native window the app spawns to show
        # cell maps / the NIF viewer / conflict views. See viewer-shell/src/main.rs.
        # Icon copied in first: tauri-build wants it present at compile time,
        # and keeping one copy of the .ico in the repo root (rather than a
        # second copy checked into viewer-shell/) is the whole reason this is
        # a build step instead of a committed file -- see viewer-shell/icons/README.md.
        shell: bash
        run: |
          cp wraithguard_toolkit_icon.ico viewer-shell/icons/wraithguard_toolkit_icon.ico
          cd viewer-shell
          cargo build --release
          ls -lh target/release/wraithguard-viewer.exe

      - uses: actions/setup-python@v5
        with:
          # Free-threaded (GIL-free) Python 3.14t. PyInstaller freezes whichever
          # interpreter runs it, so the bundled .exe is free-threaded too.
          # Nothing left in this build's dependency graph is gated on it --
          # see the header comment above.
          python-version: "3.14t"
          allow-prereleases: true
          cache: pip

      - name: Verify the free-threaded build
        # Freeze the wrong interpreter and the shipped .exe silently keeps the
        # GIL. Fail here, before the ~10-minute PyInstaller build, if so.
        run: |
          python --version
          python -c "import sys; assert not sys._is_gil_enabled(), 'GIL is enabled -- not a free-threaded build'; print('free-threaded OK')"

      - name: Install build dependencies
        # No pywebview, no pythonnet/clr, no PyQt6 -- all three were only ever
        # there for the old in-process viewer; wraithguard-viewer replaces
        # them entirely and needs nothing from pip.
        # Deliberately no pillow/numpy: the shipped app imports neither (only the
        # tools/ scripts do). The local auto-py-to-exe build happened to have them
        # installed, so its bundle was ~20 MB heavier; leaving them out keeps the
        # .exe lean. tkinterweb can use PIL for image rendering, but it is only the
        # fallback viewer -- the embedded native viewer is the primary and works
        # without it, as the 20 MB build confirmed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterweb tkinterdnd2 PyYAML ijson certifi

      - name: Build the Rust backend (native/, greatness7's tes3 crates)
        # Into the free-threaded interpreter PyInstaller freezes; PyInstaller then
        # bundles the extension module by following wraithguard's imports.
        run: python -m pip install ./native

      - name: Build the .exe
        # bash (present on Windows runners) keeps the multiline command readable;
        # PyInstaller still uses ';' as the --add-data/--add-binary separator on
        # Windows. --add-binary (not --add-data) for the viewer: it's a PE
        # executable, not a data file, and lands at "." so the viewer is found
        # directly in _MEIPASS (wraithguard/viewer_launch.py).
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "webview2" ]; then MODE=--onedir; else MODE=--onefile; fi
          python -m PyInstaller --noconfirm --clean $MODE --windowed --noupx \
            --name wraithguard_toolkit_gui \
            --icon wraithguard_toolkit_icon.ico \
            --collect-submodules wraithguard \
            --hidden-import wraithguard_native \
            --collect-all certifi \
            --hidden-import tkinterweb \
            --add-binary "viewer-shell/target/release/wraithguard-viewer.exe;." \
            --add-data "wraithguard_toolkit.py;." \
            --add-data "README.md;." \
            --add-data "QUICKSTART.md;." \
            --add-data "MLOX_RULES.md;." \
            --add-data "CREDITS.md;." \
            --add-data "License;License" \
            --add-data "viewer-shell/ui/LICENSE;License/viewer-page" \
            --add-data "wraithguard_toolkit_icon.ico;." \
            --add-data "wraithguard/viz/assets;assets" \
            wraithguard_toolkit_gui.py

      - name: Name the system build
        if: matrix.variant == 'system'
        shell: bash
        run: |
          mv "dist/wraithguard_toolkit_gui.exe" "dist/wraithguard-toolkit-windows-x86_64.exe"
          echo "ASSET=dist/wraithguard-toolkit-windows-x86_64.exe" >> "$GITHUB_ENV"

      - name: Bundle the WebView2 runtime
        if: matrix.variant == 'webview2'
        # The .cab holds one folder, Microsoft.WebView2.FixedVersionRuntime.<ver>.x64,
        # which goes in webview2\ beside the .exe as it is.
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:WEBVIEW2_URL -OutFile webview2.cab
          $dest = "dist/wraithguard_toolkit_gui/webview2"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          expand.exe webview2.cab -F:* $dest | Out-Null
          $exe = Get-ChildItem -Path $dest -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
          if (-not $exe) { throw "no msedgewebview2.exe in the downloaded runtime" }
          Write-Host "bundled WebView2: $($exe.DirectoryName)"
          Compress-Archive -Path "dist/wraithguard_toolkit_gui/*" -DestinationPath "dist/wraithguard-toolkit-windows-x86_64-webview2.zip"
          "ASSET=dist/wraithguard-toolkit-windows-x86_64-webview2.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: wraithguard-toolkit-windows-x86_64-${{ matrix.variant }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 14

      # Sign the artifact with minisign (pure-Python, no C/Rust toolchain) so the
      # download can be verified. Skipped, not failed, when the signing secret is
      # not configured yet, so a release can still go out unsigned during setup.
      - name: Sign the build (tag builds only)
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.MINISIGN_SECRET_KEY != '' }}
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        shell: bash
        run: |
          python -m pip install py-minisign==0.21.1
          python tools/sign_release.py "$ASSET"

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The .minisig line matches nothing when signing was skipped, so
          # fail_on_unmatched_files is off; the build is always produced by the
          # build step above (which fails the job if it is not).
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.minisig
          fail_on_unmatched_files: false
          # No generate_release_notes here: the Linux build is the sole owner
          # of the release notes (see its own workflow comment) so the
          # release gets one changelog, not several.
