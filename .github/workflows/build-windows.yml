# Autobuild the Windows .exe (two variants) and upload them as artifacts.
#
# Two backends for pywebview's in-app viewer, so users can pick:
#   * edgechromium (default) -- small (~40 MB); uses the WebView2 runtime that
#     ships with Windows 10/11. This is what the local auto-py-to-exe build made.
#   * qt -- larger (~180 MB) but self-contained; bundles its own Qt WebEngine, so
#     it works on machines where WebView2 has been removed.
# Both are built from the same flags the old `.spec` used (the spec itself is a
# gitignored build artifact, no longer in the repo): a single-file windowed .exe,
# the .ico icon, and pythonnet/clr for the EdgeChromium backend.

name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # create/attach to a Release on tag builds

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.backend }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: edgechromium # small; needs the WebView2 runtime on the target machine
            pip: pywebview
            platform: webview.platforms.edgechromium
            suffix: ""
          - backend: qt # larger, self-contained; for machines without WebView2
            pip: pywebview[qt]
            platform: webview.platforms.qt
            suffix: "-qt"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        # ${{ matrix.pip }} is "pywebview" or "pywebview[qt]". The [qt] extra pulls
        # PyQt6 + QtWebEngine (~140 MB); without it pywebview uses the small
        # EdgeChromium backend via pythonnet/clr.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "${{ matrix.pip }}" pythonnet tkinterweb tkinterdnd2 PyYAML zstandard certifi

      - name: Build the .exe
        # bash (present on Windows runners) keeps the multiline command readable;
        # PyInstaller still uses ';' as the --add-data separator on Windows. The
        # platform hidden import is per-variant (${{ matrix.platform }}) so
        # PyInstaller traces the right backend's runtime -- this is what the local
        # auto-py-to-exe build hinted (webview.platforms.edgechromium), and
        # getting it wrong is what produced a too-small, deps-missing .exe.
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name wraithguard_toolkit_gui \
            --icon wraithguard_toolkit_icon.ico \
            --collect-submodules wraithguard \
            --collect-all webview \
            --collect-all clr_loader \
            --collect-all pythonnet \
            --collect-all certifi \
            --hidden-import clr \
            --hidden-import ${{ matrix.platform }} \
            --hidden-import tkinterweb \
            --exclude-module PySide6 \
            --exclude-module PySide2 \
            --exclude-module shiboken6 \
            --exclude-module PyQt6.QtQml \
            --exclude-module PyQt6.QtQuick \
            --exclude-module PyQt6.QtQuickWidgets \
            --exclude-module PyQt6.QtQuick3D \
            --exclude-module PyQt6.QtPositioning \
            --exclude-module PyQt6.QtDBus \
            --exclude-module PyQt6.QtMultimedia \
            --exclude-module PyQt6.QtSpatialAudio \
            --exclude-module PyQt6.QtTextToSpeech \
            --add-data "wraithguard_toolkit.py;." \
            --add-data "README.md;." \
            --add-data "QUICKSTART.md;." \
            --add-data "MLOX_RULES.md;." \
            --add-data "wraithguard_toolkit_icon.ico;." \
            --add-data "wraithguard/viz/assets;assets" \
            wraithguard_toolkit_gui.py
          mv "dist/wraithguard_toolkit_gui.exe" \
             "dist/wraithguard-toolkit-windows-x86_64${{ matrix.suffix }}.exe"

      - name: Upload the .exe
        uses: actions/upload-artifact@v4
        with:
          name: wraithguard-toolkit-windows-x86_64${{ matrix.suffix }}
          path: dist/wraithguard-toolkit-windows-x86_64${{ matrix.suffix }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wraithguard-toolkit-windows-x86_64${{ matrix.suffix }}.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
