# Autobuild the Windows .exe and upload it as an artifact.
#
# Previously this built two variants -- an "edgechromium" leg (pywebview's
# small WebView2 backend) and a "qt" leg (pywebview's PyQt6 backend, for
# machines without WebView2). Both are gone: the in-app viewer window is now
# wraithguard-viewer, a standalone Rust/Tauri binary (see viewer-shell/),
# built here and bundled into the .exe as a data file. It uses WebView2 on
# Windows, same as the old edgechromium leg -- Windows 10 1803+/11 all ship
# it by default, the same assumption the app already made for its previous
# default build -- so there is now exactly one Windows build, and it is
# entirely free-threaded (3.14t): nothing left in the dependency graph (no
# PyQt6/sip, no pythonnet/clr -- both were only ever there for pywebview)
# blocks it. If a no-WebView2 fallback ever becomes a real requirement again,
# Tauri's installer bundler can auto-provision the WebView2 runtime; a raw
# `cargo build` binary like this one cannot, so that would mean switching
# viewer-shell over to `tauri build` rather than reintroducing a second leg.

name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # create/attach to a Release on tag builds

# Exposed at workflow level so the sign step's `if:` can test whether the key is
# configured. The `secrets` context is NOT allowed in an `if:` expression, but
# `env` is -- so the secret is surfaced here and tested as `env.MINISIGN_SECRET_KEY`.
env:
  MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            viewer-shell/target
          key: cargo-windows-${{ hashFiles('viewer-shell/Cargo.lock') }}

      - name: Build the viewer shell
        # wraithguard-viewer.exe -- the native window the app spawns to show
        # cell maps / the NIF viewer / conflict views. See viewer-shell/src/main.rs.
        # The shell keeps a PNG icon in viewer-shell/icons so Tauri does not
        # depend on platform-specific ICO decoding during the Linux/Windows build.
        shell: bash
        run: |
          cargo check --manifest-path viewer-shell/check/Cargo.toml
          cd viewer-shell
          cargo build --release
          ls -lh target/release/wraithguard-viewer.exe

      - uses: actions/setup-python@v5
        with:
          # Free-threaded (GIL-free) Python 3.14t. PyInstaller freezes whichever
          # interpreter runs it, so the bundled .exe is free-threaded too.
          # Nothing left in this build's dependency graph is gated on it --
          # see the header comment above.
          python-version: "3.14t"
          allow-prereleases: true
          cache: pip

      - name: Verify the free-threaded build
        # Freeze the wrong interpreter and the shipped .exe silently keeps the
        # GIL. Fail here, before the ~10-minute PyInstaller build, if so.
        run: |
          python --version
          python -c "import sys; assert not sys._is_gil_enabled(), 'GIL is enabled -- not a free-threaded build'; print('free-threaded OK')"

      - name: Install build dependencies
        # No pywebview, no pythonnet/clr, no PyQt6 -- all three were only ever
        # there for the old in-process viewer; wraithguard-viewer replaces
        # them entirely and needs nothing from pip.
        # Deliberately no pillow/numpy: the shipped app imports neither (only the
        # tools/ scripts do). The local auto-py-to-exe build happened to have them
        # installed, so its bundle was ~20 MB heavier; leaving them out keeps the
        # .exe lean. tkinterweb can use PIL for image rendering, but it is only the
        # fallback viewer -- the embedded native viewer is the primary and works
        # without it, as the 20 MB build confirmed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterweb tkinterdnd2 PyYAML ijson certifi

      - name: Build the .exe
        # bash (present on Windows runners) keeps the multiline command readable;
        # PyInstaller still uses ';' as the --add-data/--add-binary separator on
        # Windows. --add-binary (not --add-data) for the viewer: it's a PE
        # executable, not a data file, and lands at "." so resource_path()'s
        # join with "wraithguard-viewer.exe" finds it directly in _MEIPASS root.
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx \
            --name wraithguard_toolkit_gui \
            --icon wraithguard_toolkit_icon.ico \
            --collect-submodules wraithguard \
            --collect-all certifi \
            --hidden-import tkinterweb \
            --add-binary "viewer-shell/target/release/wraithguard-viewer.exe;." \
            --add-data "wraithguard_toolkit.py;." \
            --add-data "README.md;." \
            --add-data "QUICKSTART.md;." \
            --add-data "MLOX_RULES.md;." \
            --add-data "wraithguard_toolkit_icon.ico;." \
            --add-data "wraithguard/viz/assets;assets" \
            wraithguard_toolkit_gui.py
          mv "dist/wraithguard_toolkit_gui.exe" \
             "dist/wraithguard-toolkit-windows-x86_64.exe"

      - name: Upload the .exe
        uses: actions/upload-artifact@v4
        with:
          name: wraithguard-toolkit-windows-x86_64
          path: dist/wraithguard-toolkit-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 14

      # Sign the artifact with minisign (pure-Python, no C/Rust toolchain) so the
      # download can be verified. Skipped, not failed, when the signing secret is
      # not configured yet, so a release can still go out unsigned during setup.
      - name: Sign the .exe (tag builds only)
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.MINISIGN_SECRET_KEY != '' }}
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          python -m pip install py-minisign==0.21.1
          python tools/sign_release.py "dist/wraithguard-toolkit-windows-x86_64.exe"

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The .minisig line matches nothing when signing was skipped, so
          # fail_on_unmatched_files is off; the .exe is always produced by the
          # build step above (which fails the job if it is not).
          files: |
            dist/wraithguard-toolkit-windows-x86_64.exe
            dist/wraithguard-toolkit-windows-x86_64.exe.minisig
          fail_on_unmatched_files: false
          # No generate_release_notes here: the Linux build is the sole owner
          # of the release notes (see its own workflow comment) so the
          # release gets one changelog, not several.
