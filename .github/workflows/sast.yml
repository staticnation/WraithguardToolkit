# Static analysis (SAST): CodeQL over the page's JavaScript and the Rust crates, on every
# push and pull request and once a week (new queries land without a push). Results go to
# the repository's Security tab (Code scanning). Needs code scanning on the repository:
# free for a public one, GitHub Code Security for a private one.
#
# Complements ci.yml (tests, Clippy); it does not replace them. Build-less: the JavaScript
# is read as it is, and Rust's `none` build mode reads the sources without compiling the
# Tauri tree (no WebKitGTK on the runner needed).

name: SAST

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # uploads the results; the only write this workflow has
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Strip the page wrapper from the script fragments
        if: matrix.language == 'javascript-typescript'
        # The page is built from fragments (viewer-shell/ui/ORDER): the first opens the page's
        # <script> and the last closes it with </body></html>, which no JavaScript parser reads
        # (CodeQL: "could not process some files due to syntax errors", 03_core.js and
        # 11_events.js). Only this checkout loses the lines.
        run: sed -i -E '/^(<\/?script[^>]*>|<\/body>|<\/html>)$/d' viewer-shell/ui/src/*.js
      # Pinned to a commit like the other workflows' actions; move it with Dependabot.
      - uses: github/codeql-action/init@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
