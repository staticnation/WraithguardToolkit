# wraithguard_native: the toolkit's Rust backend, a Python extension module on
# greatness7's tes3 crates (https://github.com/Greatness7/tes3, MIT OR Apache-2.0).
# It replaces the pure-Python ports of those crates in wraithguard/ one piece at a
# time; each piece keeps its Python API, so callers do not change.
#
# Built with maturin (`pip install ./native`, see README.md here); the workflows do
# that before PyInstaller. Free-threaded Python (3.14t) is supported: the module
# declares it does not need the GIL.
[package]
name = "wraithguard-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "wraithguard_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.26"
tes3 = { git = "https://github.com/Greatness7/tes3", default-features = false, features = ["bsa", "esp", "nif", "serde", "serde-zstd"] }
serde_json = "1"
# serde values straight into Python objects: records reach Python as dicts in the
# tes3conv schema without being written out as JSON text and parsed back.
pythonize = "0.26"
# The shortest decimal for an f32, as serde_json writes it (it uses ryu).
ryu = "1"
# The crate's record framing (Reader/Writer), for writing one record at a time.
bytes_io = { git = "https://github.com/Greatness7/tes3", package = "bytes_io" }
base64 = "0.22"
regex = "1"
memmap2 = "0.9"
# greatness7's merge_to_master (public domain), as a library. It builds on stable Rust
# since upstream commit 5ea27f1 (our stable-Rust change, taken upstream). Taken from our
# fork (staticnation/merge_to_master), which follows upstream and carries what is still
# waiting there (OpenMW's LUAL records, with tes3's LUAL support below).
# No mimalloc (a Python extension keeps Python's allocator); its logging compiled out.
merge_to_master = { git = "https://github.com/staticnation/merge_to_master", default-features = false, features = ["strip-logs"] }
anyhow = "1"

# greatness7's tes3, from our fork (staticnation/tes3) until what is waiting upstream is
# taken there: OpenMW's LUAL records (Greatness7/tes3#7), Clippy in CI (#9) and our NIF
# fix. A patch rather than a changed URL, so merge_to_master's own tes3 is the same one
# and the types agree; delete this section to go back to upstream.
[patch."https://github.com/Greatness7/tes3"]
tes3 = { git = "https://github.com/staticnation/tes3" }
bytes_io = { git = "https://github.com/staticnation/tes3" }

[profile.release]
lto = "thin"
codegen-units = 1
