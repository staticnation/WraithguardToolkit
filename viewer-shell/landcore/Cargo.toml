# The landscape: Merge Lands and its settings files, and the Land view's encoder. The viewer's
# Tools page and Editor call it (port step 4.4; its history is in CHANGELOG.md).
[package]
name = "landcore"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
# `.mergedlands.toml` (meta.rs), read as Python's tomllib reads it: only the reading half, 0.8 for
# TOML 1.0 (see ordercore's note).
toml = { version = "0.8", default-features = false, features = ["parse", "preserve_order"] }
# The merged plugin written (emit.rs) as the Python's native writer writes it.
tes3 = { git = "https://github.com/Greatness7/tes3", default-features = false, features = ["esp"] }
# Vector arithmetic (curvature.rs; GLAM-PLAN.md): 0.30, the version the tes3 fork takes (a second
# glam would be a second, incompatible DVec3); no features.
glam = "0.30"

[dev-dependencies]
# The shared cases (tests/fixtures/land_merge_cases.json) are JSON; the plugins they stand for
# are checked by their SHA-256.
serde_json = "1"
sha2 = "0.10"
