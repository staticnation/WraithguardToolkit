# Compiles viewer-shell/src/cellviewer/commands.rs against viewcore with the Tauri
# surface stubbed (src/stub.rs), so the command bodies are checked on any machine
# without Tauri's native dependency tree. Adapted from Gardenfell's gdn_tauri_check.
[package]
name = "wraithguard-viewer-check-commands"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
viewcore = { path = "../viewcore" }

# Clippy, as viewcore has it (see viewcore/Cargo.toml for why).
[lints.clippy]
type_complexity = "allow"

# tes3 from our fork, as viewcore has it (see native/Cargo.toml).
[patch."https://github.com/Greatness7/tes3"]
tes3 = { git = "https://github.com/staticnation/tes3" }
bytes_io = { git = "https://github.com/staticnation/tes3" }
