# OSV-Scanner config for viewer-shell/Cargo.lock (osv-scanner reads it from the lock file's
# own directory).
#
# The [patch.crates-io] forks in Cargo.toml (staticnation/gtk-0.18-patches) keep the names and
# versions of the crates they replace, so OSV matches them by name + version and still reports
# the advisories the forks fix. Each entry below is one of those; both IDs of the glib advisory
# are listed because OSV groups them as aliases.
#
# Also here: notices with no fix to take and nothing in them to act on, each with the dependency
# it comes through (RUSTSEC-2026-0543).
#
# Drop the fork entries when the [patch.crates-io] section goes (Tauri's webview leaves gtk-rs
# 0.18); each other entry says when it goes.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "glib 0.18.5 is the fork: VariantStrIter fixed (&mut p out-argument), backported from glib 0.20 (gtk-rs-core#1343)."

[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
reason = "Alias of RUSTSEC-2024-0429: same glib VariantStrIter fix in the fork."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error 1.0.4 is the fork: same API re-exported from the maintained proc-macro-error3 (unmaintained advisory)."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
reason = "chrono is unmaintained (an informational notice, 2026-09-14: no flaw reported, no fixed version). Nothing here builds it: the command line moved to `time`, and Tauri's serde_with leaves its chrono feature off. It stays in Cargo.lock because Cargo locks every optional dependency of a crate whatever its features, and serde_with has chrono as one. Drop this when serde_with drops it or Tauri drops serde_with."

# heapless 0.8.0's 2026 advisories (2026-11-19): none in what reaches it here; see each reason.

