id = "RUSTSEC-2026-0574"
reason = "heapless 0.8.0 comes only through rstar 0.13.1, which parry3d 0.31.1 (Rapier, physcore) requires through its always-on `alloc` feature; rstar uses heapless's binary_heap::BinaryHeap and nothing else (nearest_neighbor.rs), and this advisory is in sorted_linked_list::FindMutView::pop. Drop when parry3d moves to rstar 0.14 (heapless 0.9)."

