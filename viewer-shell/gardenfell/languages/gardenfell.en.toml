# Gardenfell language pack.
#
# Every key below is one string Gardenfell shows; its English is in the comment
# above it. Give each a value in your language — a key you leave empty shows the
# English. Keep every {placeholder} exactly as it is; you may reorder them. Where
# a key ends in .one / .few / .many / .other, each form is the wording for that
# plural category (CLDR); give the forms your language has.
#
# gardenfell.en.toml is the template. Settings → Language → "Create new language
# file" starts a gardenfell.<code>.toml from it in the languages folder under where
# Gardenfell keeps your files ("Open languages folder" shows it); choose the file
# there, and "Refresh this pack" brings it up to date after a new version.
#
# Generated by page-source/catalog.js from the sources.

[language]
code     = "en"        # BCP-47: "sv", "pt-BR", "zh-Hans"
name     = "English"   # shown in the picker, in the language itself
author   = ""
made_for = "0.1.0"     # the Gardenfell version whose catalogue this followed
notes    = ""

[text]

