[package]
name = "viewcore"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Cell viewer engine: VFS/BSA, load order, ESP/ESM world, NIF meshes, DDS/TGA textures, terrain, sky and weather, for the Wraithguard cell viewer."

[dependencies]
# greatness7's TES3 crates (MIT OR Apache-2.0): archives, plugins and meshes are read with
# them. The engine's own code builds the world and the drawing from what they read.
tes3 = { git = "https://github.com/Greatness7/tes3", default-features = false, features = ["bsa", "esp", "nif"] }
bytes_io = { git = "https://github.com/Greatness7/tes3", package = "bytes_io" }
# Wraithguard: OpenMW Lua scripts read and checked (the Editor's Lua panel), the same code
# the Python backend binds (native/ takes it by path too).
luacore = { path = "../luacore" }
# Wraithguard: the openmw.cfg reader (data folders, content, groundcover, archives, chained
# cfgs), by OpenMW's documented rules - the one the Python backend uses too.
ordercore = { path = "../ordercore" }
# Wraithguard: meshoptimizer's simplifier, ported (distant objects' models, src/lod.rs).
meshopt-port = { path = "../meshopt-port" }
# Wraithguard: Greatness7's `tes3` crate reading for Gardenfell's engine (the hooks of
# patches 0001/0002), so G7's updates arrive with a version bump.
gardenfell-g7 = { path = "../gardenfell-g7" }
# Wraithguard: Gardenfell's engine crates (Robin Hjelte, MIT), vendored unmodified in
# viewer-shell/gardenfell (VENDOR.md); viewcore's modules re-export them and add ours on top
# (REBASE-18hu.md, R1c). The grass crates are not among them.
gardenfell-bytes = { path = "../gardenfell/crates/gardenfell-bytes" }
gardenfell-text = { path = "../gardenfell/crates/gardenfell-text" }
gardenfell-tes3 = { path = "../gardenfell/crates/gardenfell-tes3" }
gardenfell-nif = { path = "../gardenfell/crates/gardenfell-nif" }
gardenfell-bsa = { path = "../gardenfell/crates/gardenfell-bsa" }
gardenfell-install = { path = "../gardenfell/crates/gardenfell-install" }
gardenfell-world = { path = "../gardenfell/crates/gardenfell-world" }

# Wraithguard: OpenMW's navmesh.db (an SQLite file) read for the navmesh overlay. rusqlite
# is MIT; "bundled" builds SQLite (public domain) from source, so no system library is
# needed on any of the three OSes. Only the read-only API is used.
rusqlite = { version = "0.32", features = ["bundled"] }

# Clippy (tools/build_and_check_rust.ps1, CI): everything on except what is a style call
# this code base has made on purpose.
[lints.clippy]
# The NIF reader's per-record tables are tuples in the file's own field order; naming
# each one a type alias would scatter what the code beside it already says.
type_complexity = "allow"
# `chunks_exact(n)` over vertex/pixel data reads as what it is; `as_chunks` is newer
# Rust (1.88) for the same thing and buys nothing here.
chunks_exact_to_as_chunks = "allow"
# Index loops over x/y/z and r/g/b in maths code: clearer than zip/enumerate chains.
needless_range_loop = "allow"

# Our fork of tes3 (staticnation/tes3) until what is waiting upstream is taken there (see
# native/Cargo.toml). A [patch] only counts in the package being built, so the viewer's
# Cargo.toml and check-commands' carry the same section.
[patch."https://github.com/Greatness7/tes3"]
tes3 = { git = "https://github.com/staticnation/tes3" }
bytes_io = { git = "https://github.com/staticnation/tes3" }
