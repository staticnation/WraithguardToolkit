<!-- Wraithguard: inserted before </head> by build.rs (and by tests/boot.js).

     The Wraithguard theme and the viewer's own pieces of chrome. The theme block below is
     Wraithguard's stock dark palette; at launch the shell hands the page Wraithguard's
     *current* palette (`__WG_VIEW__.theme`, its `DARK` dict) and Themes.wraithguard()
     rewrites this block from it, so the viewer wears whatever the toolkit is wearing.
     Everything else is derived from those few colours with color-mix, the way the
     page's own themes derive theirs. -->
<style id="wg-theme">
[data-theme="wraithguard"]{
  --wg-bg:#1e1e1e; --wg-bg2:#252526; --wg-field:#2d2d30; --wg-border:#3f3f46;
  --wg-fg:#e6e6e6; --wg-fg-dim:#9a9a9a; --wg-select:#094771;
  --wg-btn:#3a3a3d; --wg-btn-active:#4a4a4e; --wg-accent:#3794ff; --wg-on-accent:#1b1b1b;
  --wg-log:#141414;

  --bg:var(--wg-log); --bg2:var(--wg-bg); --bg3:var(--wg-bg2); --bg4:var(--wg-field);
  --line:var(--wg-border); --line2:var(--wg-btn-active);
  --tx:var(--wg-fg); --tx2:color-mix(in srgb,var(--wg-fg) 55%,var(--wg-fg-dim)); --tx3:var(--wg-fg-dim);
  --ac:var(--wg-accent); --ac2:color-mix(in srgb,var(--wg-accent) 70%,var(--wg-bg));
  --acd:color-mix(in srgb,var(--wg-accent) 16%,var(--wg-bg)); --on-ac:var(--wg-on-accent);
  --info:color-mix(in srgb,var(--wg-select) 55%,var(--wg-fg)); --info2:var(--wg-select);
  --orbit:var(--wg-accent);
  /* Wraithguard's brass, for the few places that want a warm counterpoint (the brand). */
  --wg-brass:#c9a227;
  --bloom:6%; --bloom-band:5%;
  --r-ctl:3px; --r-fld:3px; --r-box:5px;
}
</style>
<style id="wg-viewer">
#brand{align-items:center!important;gap:8px}
#brand img{width:22px;height:22px;image-rendering:auto;filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
#brand b{font-size:14px;letter-spacing:.3px}
#brand b span{color:inherit}
#left{width:280px!important;flex:0 0 280px!important}

/* ORI, the object inspector (24_ori.js). */
.ori{position:absolute;top:44px;left:12px;width:360px;max-height:calc(100% - 90px);overflow:auto;
  background:color-mix(in srgb,var(--bg2) 94%,transparent);border:1px solid var(--line2);
  border-radius:var(--r-box,6px);box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:30;font-size:12px;
  backdrop-filter:blur(6px)}
.ori .orihead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);
  border-left:3px solid var(--ac)}
.ori .oribody{padding:6px 10px 10px}
.ori .orirow{display:flex;gap:8px;padding:3px 0}
.ori .orirow .k{flex:0 0 96px;color:var(--tx3)}
.ori .orirow .v{flex:1;min-width:0;overflow-wrap:anywhere}
.ori .orisec{margin:10px 0 3px;font-weight:600;color:var(--ac);font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.ori .from{color:var(--tx3);font-size:11px}
.ori .tag{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
/* The Editor mode (50_wg_editor.js): the Object Window and Cell View docked where the
   Cell Preview's settings are, the render window beside them, the record dialog over it. */
#edDock{display:none}
body.wgEditMode #left{display:none}
body.wgEditMode #edDock{display:flex;flex-direction:column;width:460px;flex:0 0 460px;min-height:0;
  background:var(--bg2);border-right:1px solid var(--line);resize:horizontal;overflow:hidden}
#edDock .edPane{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--line)}
#edObjects{flex:3}
#edCells{flex:2}
#edDock .edHead{display:flex;align-items:center;gap:6px;padding:6px 8px;border-left:3px solid var(--ac);background:var(--bg3,var(--bg2))}
#edDock .edTabs{display:flex;flex-wrap:wrap;gap:3px;padding:6px 8px 0}
#edDock .edTabs .btn{padding:1px 6px;font-size:11px}
#edDock .edTabs .btn.on{background:var(--acd);border-color:var(--ac);color:var(--tx)}
#edDock .edBar{display:flex;align-items:center;gap:8px;padding:6px 8px}
#edDock .edBar .fld{flex:1}
#edDock .edTable{flex:1;overflow:auto;min-height:0}
#edDock .edSplit{display:flex;flex:1;min-height:0}
#edDock .edSplit .edTable{flex:1;border-right:1px solid var(--line)}
.edT{width:100%;border-collapse:collapse;font-size:11.5px}
.edT th{position:sticky;top:0;background:var(--bg3,var(--bg2));text-align:left;font-weight:600;padding:3px 6px;cursor:pointer;
  border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.edT td{padding:2px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:150px}
.edT td.num{text-align:right}
.edT tbody tr{cursor:default}
.edT tbody tr:hover{background:color-mix(in srgb,var(--ac) 10%,transparent)}
.edT tbody tr.sel{background:color-mix(in srgb,var(--ac) 22%,transparent)}
/* What the CSSE marks light green: changes waiting. */
.edT tbody tr.edited{background:color-mix(in srgb,#3fb950 16%,transparent)}
.edT tbody tr.edited.sel{background:color-mix(in srgb,#3fb950 28%,transparent)}
#edDlg{left:auto;right:132px;width:460px}
#edUsesPanel{left:auto;right:604px;width:460px;max-height:70vh}
#edLayers{left:auto;right:604px;width:320px}
#edQ{position:fixed;width:230px;z-index:60;padding:4px 0}
#edQ .it{padding:3px 10px;cursor:pointer;white-space:nowrap}
#edQ .it:hover{background:var(--acd)}
#edPend{left:auto;right:604px;width:360px}
.edFields td{white-space:normal;max-width:none;vertical-align:top}
.edFields td.k{color:var(--tx3);width:38%;overflow-wrap:anywhere}
.edFields .fld{width:100%;box-sizing:border-box}
.edFields .fld.bad,.edFields input.bad{outline:1px solid #e5534b}
.edFields .edVec{display:flex;align-items:center;gap:3px;margin:1px 0}
.edFields .edList td{padding:1px 2px}
.edFields .edList .fld{min-width:0}
.edFields .edVec .from{width:12px}
.edFields .edVec .fld{flex:1;min-width:0;width:auto}
#btnEditor.on{background:var(--acd);border-color:var(--ac)}
/* The full help (46_wg_tfh.js): on the right, the inspector on the left. */
#tfhPanel{left:auto;right:12px;width:380px}
.tfhgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:4px}
.tfhitem{position:relative;border:1px solid var(--line);border-radius:4px;padding:3px;text-align:center;cursor:pointer;
  background:color-mix(in srgb,var(--bg3,var(--bg2)) 70%,transparent)}
.tfhitem:hover{border-color:var(--ac)}
.tfhitem img{width:32px;height:32px;image-rendering:pixelated;display:block;margin:0 auto}
.tfhitem .ph{width:32px;height:32px;margin:0 auto;border:1px dashed var(--line2);border-radius:3px}
.tfhitem .n{position:absolute;right:3px;bottom:14px;font-size:10px;font-weight:600;text-shadow:0 0 3px #000}
.tfhitem .l{font-size:9.5px;color:var(--tx3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tfhitem.list{border-style:dashed}
/* The panels' accordions (OriAcc in 24_ori.js). */
.ori details.oriacc>summary.orisec{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
.ori details.oriacc>summary.orisec::-webkit-details-marker{display:none}
.ori details.oriacc>summary.orisec::before{content:"\25B8";font-size:9px;transition:transform .12s}
.ori details.oriacc[open]>summary.orisec::before{transform:rotate(90deg)}
.ori details.oriacc>summary.orisec:hover{filter:brightness(1.2)}
.ori a.orimod{font-family:var(--mono);color:var(--ac);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--ac2)}
/* The mesh viewer: the cell side's controls have nothing to act on. */
body.wgMeshMode :is(#cellRow,#cellPane,#secCellTex,#pvModeHint,#grassfarRow,#tbMap,#tbArrows,#tbEmpty,#tbHiTex,#tbHiSlot,#noctx,#vpempty){display:none!important}
.mvSeg{gap:4px!important;flex-wrap:wrap}
.mvSeg .btn.on{background:var(--ac2);color:var(--tx1,#fff)}
.mvShape{padding:3px 4px;border-radius:3px;cursor:pointer}
.mvShape:hover{background:var(--bg3,rgba(255,255,255,.06))}
.mvShape.on{outline:1px solid var(--ac)}
.mvShape span{color:var(--tx3);font-size:11px}
.nifTree{font-family:var(--mono);font-size:11px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:4px;padding:4px 2px}
.nifTree ul{list-style:none;margin:0;padding-left:12px}
.nifTree>ul{padding-left:2px}
.nifTree .nb{cursor:pointer;white-space:nowrap;padding:1px 4px;border-radius:3px}
.nifTree .nb:hover{background:var(--bg3,rgba(255,255,255,.06))}
.nifTree .nb.sel{background:var(--ac2);color:var(--tx1,#fff)}
.nifTree .ix{color:var(--tx3)}
.nifTree .nm{color:var(--ac)}
.nifTree .no{color:var(--tx3);font-style:italic}
#mvFields .orirow .k{flex:0 0 130px;font-family:var(--mono);font-size:11px}
#mvFields input.nf{flex:1;min-width:0;font-family:var(--mono);font-size:11px}
#mvFields input.bad{outline:1px solid #d9534f}
#mvFields .orirow.dirty .k{color:var(--ac)}
#mvFields .orirow.dirty .k::after{content:" \25CF"}
.ori a.orimod:hover{border-bottom-style:solid}
/* The Preview's accordions (48_wg_tools.js): a lighter band per group. */
#secCell .sect.pvacc{margin-top:6px}
#secCell .sect.pvacc>.sh{background:var(--bg3);padding:6px 8px;border-radius:var(--r-ctl,3px);
  font-size:10.5px;letter-spacing:.5px;color:var(--tx2)}
#secCell .sect.pvacc>.sh:hover{background:var(--bg4);color:var(--tx)}
#secCell .sect.pvacc>.sbody{padding:8px 2px 4px}
body.wgMeshMode :is(#acc_review,#acc_land,#acc_ovl,#acc_links){display:none!important}
/* The review, overlay and link tools (48_wg_tools.js). */
.wgList{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:4px;margin-top:6px;font-size:11px}
.wgList .it{display:flex;gap:6px;align-items:baseline;padding:3px 6px;cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.wgList .it:hover{background:var(--bg4)}
.wgList .it .k{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wgList .it .n{color:var(--tx3);font-family:var(--mono);font-size:10.5px}
.wgKey{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.wgStats{font-size:11px;color:var(--tx2);margin:4px 0 2px;line-height:1.5}
.wgBtns{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
#wgMeasure{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:25;padding:5px 10px;
  background:color-mix(in srgb,var(--bg2) 92%,transparent);border:1px solid var(--line2);border-radius:var(--r-box,5px);
  font-size:12px;font-family:var(--mono)}
.wgDlg{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:460px;max-height:70%;overflow:auto;z-index:40}
</style>
<script>document.title='Wraithguard - Cell Preview';</script>
