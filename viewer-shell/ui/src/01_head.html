     however." These are masks, so the colour is this one declaration; the Grass Rules
     seedling is not one — it is a full-colour drawing with its greens baked in, which is
     exactly why it stays green without being told to. */
  background-color:var(--ico,var(--ac));
  -webkit-mask:no-repeat center/contain;mask:no-repeat center/contain}
/* A folder — the plainest of the three sources, and the one that stays legible smallest. */
.ic-folder{-webkit-mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2399ad6a'\
 stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>\
<path d='M2.2 12.4V4.6c0-.6.4-1 1-1h3.1l1.6 2h5.9c.6 0 1 .4 1 1v5.8c0 .6-.4 1-1 1H3.2c-.6 0-1-.4-1-1z'/>\
</svg>");mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2399ad6a'\
 stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>\
<path d='M2.2 12.4V4.6c0-.6.4-1 1-1h3.1l1.6 2h5.9c.6 0 1 .4 1 1v5.8c0 .6-.4 1-1 1H3.2c-.6 0-1-.4-1-1z'/>\
</svg>")}
/* Stacked plates: a load order, which is what MO2 hands over. */
.ic-stack{-webkit-mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2399ad6a'\
 stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>\
<path d='M8 2.2 13.8 5.1 8 8 2.2 5.1z'/><path d='M2.2 7.7 8 10.6l5.8-2.9'/>\
<path d='M2.2 10.3 8 13.2l5.8-2.9'/></svg>");mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2399ad6a'\
 stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>\
<path d='M8 2.2 13.8 5.1 8 8 2.2 5.1z'/><path d='M2.2 7.7 8 10.6l5.8-2.9'/>\
<path d='M2.2 10.3 8 13.2l5.8-2.9'/></svg>")}
/* A config file with a prompt in it: this button really is "find openmw.cfg". */
.ic-cfg{-webkit-mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2399ad6a'\
 stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>\
<path d='M4 2.4h5.2l3 3v8.2c0 .5-.4.9-.9.9H4c-.5 0-.9-.4-.9-.9V3.3c0-.5.4-.9.9-.9z'/>\
<path d='M9.2 2.4v3h3'/><path d='M6 9.1l1.7 1.7L6 12.5'/><path d='M9 12.5h2.2'/></svg>");mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2399ad6a'\
 stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>\
<path d='M4 2.4h5.2l3 3v8.2c0 .5-.4.9-.9.9H4c-.5 0-.9-.4-.9-.9V3.3c0-.5.4-.9.9-.9z'/>\
<path d='M9.2 2.4v3h3'/><path d='M6 9.1l1.7 1.7L6 12.5'/><path d='M9 12.5h2.2'/></svg>")}
/* The plugin, with the arrow cut *through* it rather than drawn on it: what shows in the
   hole is the button itself, so it stays right when the olive lightens under the pointer.
   Dark ink, because this one rides the primary button and olive on olive is nothing. The
   arrow sits half a step below the box's centre — Robin's eye, and he was right: an arrow
   with a heavy head reads high when it is centred by arithmetic. */
.ic-esp{width:14px;height:14px;--ico:var(--on-ac);-webkit-mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'>\
<path fill='%2314170d' fill-rule='evenodd' d='M8 1.5 14.1 5v7L8 15.5 1.9 12V5zM8 4.55 4.7 8.45h1.9v3.6h2.8v-3.6h1.9z'/>\
</svg>");mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'>\
<path fill='%2314170d' fill-rule='evenodd' d='M8 1.5 14.1 5v7L8 15.5 1.9 12V5zM8 4.55 4.7 8.45h1.9v3.6h2.8v-3.6h1.9z'/>\
</svg>")}
/* Round 18bc: the painting pair. A **palette** while painting is off and a **check mark**
   while it is on, swapped by `11_events.js` as the button toggles — the glyph used to be a
   `✎` and a `✓` baked into the two labels, and a pen is what every other button in the app
   means "edit" with. Robin, choosing from five proposed pairs: "I like the palette (option
   D) for the Start Painting button"; and of the stop half, after seeing six crossed-out
   palettes, "Lets keep the 'Painting — click to stop' glyph simple, and keep a check mark
   for it, no palette involved." Masks, so the colour is CSS's: olive at rest, and dark ink
   on the lit green button, where olive on olive would be nothing — the same reasoning, and
   the same `#14170d`, as `.ic-esp` above. */
.ic-palette{-webkit-mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2399ad6a'\
 stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>\
<path d='M8 1.5c3.7 0 6.7 2.5 6.7 5.6 0 1.9-1.5 2.7-2.9 2.7h-1.2c-1.1 0-2 .8-2 1.8 0 .4.1.7.1 1 0 .8-.6 1.4-1.5 1.4-3.7 0-6.7-3-6.7-6.7S4.3 1.5 8 1.5z'/>\
<circle cx='5.2' cy='5.5' r='1.05' fill='%2399ad6a' stroke='none'/>\
<circle cx='8.6' cy='4.4' r='1.05' fill='%2399ad6a' stroke='none'/>\
<circle cx='11.4' cy='6.3' r='1.05' fill='%2399ad6a' stroke='none'/>\
<circle cx='4.3' cy='9.3' r='1.05' fill='%2399ad6a' stroke='none'/></svg>");mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2399ad6a'\
 stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>\
<path d='M8 1.5c3.7 0 6.7 2.5 6.7 5.6 0 1.9-1.5 2.7-2.9 2.7h-1.2c-1.1 0-2 .8-2 1.8 0 .4.1.7.1 1 0 .8-.6 1.4-1.5 1.4-3.7 0-6.7-3-6.7-6.7S4.3 1.5 8 1.5z'/>\
<circle cx='5.2' cy='5.5' r='1.05' fill='%2399ad6a' stroke='none'/>\
<circle cx='8.6' cy='4.4' r='1.05' fill='%2399ad6a' stroke='none'/>\
<circle cx='11.4' cy='6.3' r='1.05' fill='%2399ad6a' stroke='none'/>\
<circle cx='4.3' cy='9.3' r='1.05' fill='%2399ad6a' stroke='none'/></svg>")}
.ic-done{width:14px;height:14px;--ico:var(--on-ac);-webkit-mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2314170d'\
 stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\
<path d='M2.9 8.7 6.3 12.1 13.1 4.3'/></svg>");mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2314170d'\
 stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\
<path d='M2.9 8.7 6.3 12.1 13.1 4.3'/></svg>")}
/* A wireframe rock, for the Edit a mesh buttons — same species as the tuft above:
   drawn, so it renders identically whatever fonts a machine has. */
/* Round 18cm: **a mask, like the rest of the drawn marks.** Robin: "The glyph in 'Edit a
   mesh' button, no matter if in the click an object dialogue, or the left panel, should also
   be possible to recolor, and follow the accent color."

   It was a `background-image` with `stroke='%2399ad6a'` baked into it, so it stayed olive in
   every palette while the Start painting palette beside it followed the accent — the same
   distinction 18cj drew between the masked glyphs and the Grass Rules seedling, except that
   this one is a single-colour drawing and so has no reason to be on the wrong side of it.
   The stroke colour in the data URI is now irrelevant: a mask reads alpha, not hue. */
.meshgl{display:inline-block;width:12px;height:12px;vertical-align:-1px;
  background-color:var(--ico,var(--ac));
  -webkit-mask:no-repeat center/contain;mask:no-repeat center/contain;
  -webkit-mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'>\
<g fill='none' stroke='%23fff' stroke-width='1.1' stroke-linejoin='round'>\
<path d='M1 9.5 L4 2 L10.8 4.5 L8.5 10.5 Z'/>\
<path d='M4 2 L8.5 10.5 M1 9.5 L10.8 4.5'/></g></svg>");
  mask-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'>\
<g fill='none' stroke='%23fff' stroke-width='1.1' stroke-linejoin='round'>\
<path d='M1 9.5 L4 2 L10.8 4.5 L8.5 10.5 Z'/>\
<path d='M4 2 L8.5 10.5 M1 9.5 L10.8 4.5'/></g></svg>")}
/* Round 17y: the door button in the object dialogue - green, with an open door drawn the
   same way: a frame and a leaf swung out. Robin: "Make that button green, and put a simple
   open door glyph in the button." 18a: the theme's green, not another one - the same
   --ac2/--ac pair and dark ink as .btn.pri, which is what "Back to preview" wears. */
.btn.door{background:var(--ac2);border-color:var(--ac);color:var(--on-ac);font-weight:600}
.btn.door:hover{background:var(--ac)}
/* Round 18an: "→ Balmora, Guild of Mages" beside the door button. Centred on the button's
   line; `hidden` still hides it, since nothing here sets a display. */
.doorto{font-size:12px;color:var(--tx2);align-self:center;white-space:nowrap}
.doorgl{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px;
  background:no-repeat center/contain url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'>\
<g fill='none' stroke='%2314170d' stroke-width='1.2' stroke-linejoin='round'>\
<path d='M2 1.5 H8.5 V11 H2 Z'/>\
<path d='M8.5 1.5 L11 3 V11 L8.5 11' fill='%2314170d' fill-opacity='.35'/>\
<circle cx='4.2' cy='6.5' r='.6' fill='%2314170d'/></g></svg>")}
/* Round 18cj: **a diamond, a size up from the dot.** Robin: "instead of a dot before the
   grass rules, I want a diamond that is a little bit bigger than the dot is now." 7px
   square turned 45° — the same shape the slider handles and the selection marker wear, so
   the list joins the motif rather than being the one round thing left in it. `flex-basis`
   is the 7px the box takes; the rotation happens inside it and needs no room, because a
   square's diagonal only reaches past its own edge diagonally. */
/* Round 18cj turned the dot into a diamond — "instead of a dot before the grass rules, I
   want a diamond that is a little bit bigger than the dot is now" — and went from a 6px
   circle to a 7px square on its corner. Round 18cn takes the square back to six: rotating
   it is what made it bigger, not the pixel that was added to it. A square's diagonal is
   its side times 1.41, so a 6px diamond already stands 8.5px tall where the old circle
   stood 6 — the 7 read as 9.9 and crowded the name beside it. Robin, having lived with it:
   "make the diamonds next to grass rules slightly smaller." */
.sel .dot{width:6px;height:6px;border-radius:0;transform:rotate(45deg);
  background:var(--line2);flex:0 0 6px}
.sel .dot.live{background:var(--ac)}
.sel .dot.off{background:var(--err)}
.sel.unk{box-shadow:inset 2px 0 0 var(--err)}
/* Rules that belong to no ground: mauve, which is this palette's stand-in for blue and
   is used nowhere else in the left column, so the two kinds of rule are told apart at a
   glance rather than by reading. Grouped as well as coloured — see `renderSelList`. */
.sel.paint .nm{color:var(--info)}
.sel.paint .dot{background:color-mix(in srgb,var(--info) 42%,var(--bg))}
.sel.paint .dot.live{background:var(--info)}
/* Round 18ci: **selected the same way a texture rule is, in its own colour.** Robin: "I
   want the bolded line to the left of the selected area to be Mauve as the paint only
   rules are, and I don't want the outline, so it looks more like the grass texture rules,
   but with its own color."

   It had both halves wrong at once: the bar came from `.sel.on` and so was *olive* on a
   mauve row, and the mauve was spent on a border instead — a rule wearing another rule's
   mark with an outline around it. Now it is the same three statements `.sel.on` makes, with
   `--info` where the accent goes, and the two shades derived rather than picked: the ground
   is the mix `--acd` is of the accent, and the name is the same 58% mix the texture rules
   use. Which also means a theme reaches them — the hand-picked `#2a1f27` and `#c79cbb` were
   a dark-theme pair, and on Redoran Bone they were a black block in a pale list. */
/* Round 18cn: the outline reaches this one too, in its own colour — `--info2` is to the
   mauve what `--ac2` is to the accent, declared by each theme rather than mixed here, so a
   pale theme darkens it where a dark theme lightens. The "I don't want the outline" above
   was about a *mismatched* outline on a mauve row; this is the same ring the texture rules
   now wear, in the colour this row already owns. */
.sel.paint.on{background:color-mix(in srgb,var(--info) 14%,var(--bg2));
  border-color:var(--info2);box-shadow:inset 2px 0 0 var(--info)}
.sel.paint.on .nm{color:color-mix(in srgb,var(--info) 58%,var(--tx))}
.sel.paint.on .qual{color:var(--info)}
/* A group heading, and the switch that folds its rules away.
   The whole row is the target rather than the caret alone: it is a heading nobody clicks
   for any other reason, and a 9-pixel glyph is not something to ask anyone to hit. */
.selgroup{display:flex;align-items:center;gap:6px;
  font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);
  padding:8px 8px 3px;user-select:none;cursor:pointer}
.selgroup:hover{color:var(--tx2)}
.selgroup .sp{flex:1}
.selgroup .caret{font-size:8px;transition:transform .15s;display:inline-block}
.selgroup.shut .caret{transform:rotate(-90deg)}
/* The count, which is only filled in while the group is shut — the rest of the time the
   rows are the count. Not `.pill`: this heading is nine and a half pixels tall and a
   bordered capsule beside it reads as a second, louder thing. */
.selgroup .gn{font-size:9.5px;color:var(--tx3);text-transform:none;letter-spacing:.2px}
/* A group with nothing in it is still a heading — it says where a rule of that kind would
   go — but it is not something to fold, so it does not offer a caret to click. Dimmed
   rather than hidden, for the same reason it is there at all. */
.selgroup.none{opacity:.55;cursor:default}
.selgroup.none:hover{color:var(--tx3)}
.selgroup.none .caret{visibility:hidden}
.selgroup+.sel{margin-top:0}
.selgroup.inview .gname{color:var(--ac)}
/* Delete and duplicate.
   They were `--tx3` at font-size 13 with no target of their own: two grey marks the same
   colour as the scope text beside them, on a row you had to already be hovering to see at
   all. Deleting a rule is the one irreversible thing this list does, so the cross reads as
   what it is — red, and the size of a thing you are meant to be able to hit. Both get a
   square to land on rather than two pixels of glyph.

   **`line-height:0` on the cross, not 1.** A flex box centres the *line box*, and a line
   box carries the font's descender space below the glyph — so `×`, which has no descender,
   came out sitting low in its square as if it were a letter on a baseline. Zeroing the
   line height collapses the box onto the glyph and the flex centring then lands on the
   mark itself. It is a symbol, not a letter. */
.sel .del,.sel .dup,.sel .pwr,.btn.ic.delx{
  line-height:0;width:20px;height:20px;flex:0 0 20px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;border-radius:4px;
  background:none;border:0;cursor:pointer;transition:background .12s,color .12s}
.sel .del,.sel .dup,.sel .pwr{opacity:0}
/* Round 15: the power glyph beside copy and delete, and a switched-off rule at a glance -
   dimmed, its name struck through, its dot hollow. */
.sel .pwr{font-size:13px;color:var(--tx2)}
.sel .pwr:hover{color:var(--tx);background:var(--line2)}
.sel:hover .pwr,.sel.on .pwr{opacity:1}
.sel.disabled .pwr{opacity:1;color:var(--warn)}
.sel.disabled .nm{text-decoration:line-through;color:var(--tx3)}
.sel.disabled .txt{opacity:.6}
/* Hollow, at 1.2px rather than 1.5: the diamond lost a pixel in 18cn and 1.5px walls on
   a 6px box leave a 3px void, which is more wall than hole and stops reading as hollow. */
.sel.disabled .dot{background:none;box-shadow:inset 0 0 0 1.2px var(--warn)}
/* Round 17f: the Enabled button lives in the panel's head next to Duplicate and wears
   the same `btn sm`; off, it goes amber so a switched-off rule still says so. */
#btnRuleOn.off{color:var(--warn);border-color:rgba(214,158,60,.55);background:rgba(214,158,60,.12)}
.sel .dup{font-size:13px;color:var(--tx2)}
.sel .del,.btn.ic.delx{color:var(--del)}
/* The cross is drawn, not typed — see `DEL_MARK`. A replaced element in a flex box is
   centred by its own geometry, so where it sits no longer depends on which font the
   machine happens to have. */
.delsvg{display:block;width:20px;height:20px}
.sel:hover .del,.sel:hover .dup,.sel.on .del,.sel.on .dup{opacity:1}
.sel .del:hover,.btn.ic.delx:hover{color:#fff;background:var(--del)}
.sel .dup:hover{color:var(--tx);background:var(--line2)}
.empty{padding:22px 14px;text-align:center;color:var(--tx3);font-size:12px;line-height:1.6}
/* Round 9a item 3: a row in the rule picker. */
.rprow:hover{background:var(--bg4)}
.rprow.on{background:var(--acd)}

/* ---------- paint layers ---------- */
/* A layer is a name, an eye, a cross and the colours on it. Boxed rather than merely
   spaced, because the strip of colours below a heading has to read as belonging to it —
   two unboxed layers next to each other look like one long strip with a label in the
   middle of it. The layer being worked on wears the accent border, the same as the
   selected rule in the left list does, so "which one am I on" has one answer everywhere. */
/* All the layers in one box.
 *
 * Robin: "I want to encapsulate all layers in a container, with a bit darker background,
 * to clearly separate them from the rest of the elements. The + Paint rule and + Layer
 * should be outside of that container, and the same is true for the description just below
 * the layers." Which is the right cut: the two buttons *make* layers and the hint explains
 * them, so neither is one — a box that swallowed them would say a person's layers included
 * a paragraph of prose.
 *
 * Empty it disappears entirely. A blank sunken rectangle before the palette has loaded
 * would read as a layer that failed to draw. */
#paintLayers{background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:7px 7px 1px;margin:2px 0 8px}
#paintLayers:empty{display:none;padding:0;border:0;margin:0}
/* Round 18q: the same ground as a grass card (`.slot`). Robin: "The background for the
   canopies cards and the layer cards are a bit dark. Make those backgrounds the same
   color as the Grass mesh cards." They are the same kind of thing - one entry in a list
   you edit - and two shades of it read as two kinds. */
.player{border:1px solid var(--line);border-radius:6px;padding:6px 7px;margin-bottom:6px;
  background:var(--bg3)}
.player.on{border-color:var(--ac2);background:var(--acd)}
.plhead{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.plname{flex:1;min-width:0;font-size:11.5px;color:var(--tx2);cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player.on .plname{color:color-mix(in srgb,var(--ac) 58%,var(--tx));font-weight:600}
.plcount{font-size:10px;color:var(--tx3);white-space:nowrap}
.plrename{flex:1;min-width:0;font-size:11.5px;padding:2px 6px}
/* Both marks are drawn rather than typed — see `OVER_MARK` and friends in 03_core.js. A
   replaced element in a flex box is centred by its own geometry, so neither depends any
   more on where a fallback font happens to put an arrow inside its line box. Each pair is
   one drawing in two states, so a row does not change shape as either is toggled. */
.glyphsvg{display:block;width:20px;height:20px}
.btn.ic.plover{line-height:0;width:20px;height:20px;flex:0 0 20px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;
  color:var(--info);border-radius:4px}
.btn.ic.plover.add{color:var(--ac)}
.btn.ic.plover:hover{background:var(--line2);color:var(--tx)}
.btn.ic.pleye{line-height:0;width:20px;height:20px;flex:0 0 20px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;
  color:var(--ac);border-radius:4px}
.btn.ic.pleye.off{color:var(--tx3)}
.btn.ic.pleye:hover{background:var(--line2);color:var(--tx)}
.plstrip{display:flex;flex-wrap:wrap;gap:5px}
/* Round 18k: a canopy is a layer-shaped container whose strip is a column of patterns
   rather than a row of colours. The name is a field, editable in place. */
.player.canopy input.plname{cursor:text;padding:2px 6px;background:var(--bg);border:1px solid var(--line2);
  border-radius:4px;font-family:inherit;color:var(--tx)}
.player.canopy input.plname:focus{outline:none;border-color:var(--ac2)}
.canopypats{flex-direction:column;align-items:stretch;gap:4px}
.patrow{display:flex;gap:6px;align-items:center}
.patrow .fld{font-size:11.5px;padding:3px 7px;font-family:var(--mono)}

/* Start painting: the one control in the section that changes what the mouse does.
 *
 * Robin: "Make the 'Start painting' button bigger and more clear." It was an ordinary
 * `.btn` in a column of ordinary `.btn`s, so the switch that changes what your right mouse
 * button does looked exactly like the button that adds a layer. Full width, taller, and
 * lit while it is on — the same olive the active tool wears, so "I am in paint mode" reads
 * the same way everywhere. */
#paintMode,#staticPick{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:11px 12px;margin:2px 0 0;
  font-size:12.5px;font-weight:700;letter-spacing:.3px;
  border-radius:7px;
}
/* The ordinary hover, restated because the ID selectors above would otherwise leave
   these two with no hover of their own. **Not `.pri`**, though (round 18bc): an ID beats
   `.btn.pri:hover`, so while painting the lit green button went *grey* under the pointer
   instead of brighter green, which is the one button in the app whose hover contradicted
   every other button of the same styling. Robin: "I want it to be the brighter green when
   I hover it so that it mirrors the other buttons of the same style." */
/* Round 18cj: the same derived hover every other button has. Robin: "The Start painting
   and Edit a mesh buttons becomes super dark on hover in Redoran Bone skin" — these two
   restated `.btn:hover`'s old literals, and a literal that means "a step lighter" on a
   dark ground means "a step darker than the text" on a pale one. */
#paintMode:not(.pri):hover,#staticPick:not(.pri):hover{
  background:color-mix(in srgb,var(--bg4) 86%,var(--tx) 14%);
  border-color:color-mix(in srgb,var(--line2) 72%,var(--tx) 28%)}
/* A label's buttons on their own line beneath it — round 4 item 9's shape for the
   statics-rules and profile pairs. */
.btnline{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 4px}

/* ---------- several rules at once ---------- */
/* A row in the selection but not the one whose identity the panel shows. Marked on the
   left edge rather than by its background, so it reads as "also held" instead of as a
   second, competing "current". */
.sel.msel{background:var(--bg3);box-shadow:inset 3px 0 0 var(--ac2)}
.sel.msel.on{background:var(--acd);box-shadow:inset 3px 0 0 var(--ac)}
.sel.paint.msel{box-shadow:inset 3px 0 0 var(--info)}
.bulkbar{display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:8px;
  background:var(--acd);border:1px solid var(--ac2);border-radius:6px}
.bulkcount{font-weight:600;color:color-mix(in srgb,var(--ac) 58%,var(--tx));font-size:11.5px}
.bulknote{flex:1;font-size:11px;color:var(--tx2)}
.bulklist{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.bulkone{font-family:var(--mono);font-size:10.5px;color:var(--tx2);background:var(--bg3);
  border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.bulkone.paint{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,var(--bg))}
/* A field the selected rules do not agree about. The em-dash is the placeholder, so it
   disappears the moment you type — which is also the moment it stops being true. */
.fld.mixed{color:var(--tx3)}
.fld.mixed::placeholder{color:var(--tx2);opacity:1}
.val.mixed{color:var(--tx2)}
.sw.mixed .tr{background:var(--line2);position:relative}
/* The dash the mixed state draws is centred on the *rail*, which the 6px inset moved. */
.sw.mixed .tr::after{inset:0}
.sw.mixed .tr::after{content:"—";position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:10px;color:var(--tx2)}
/* Stands where a grass card would, so the panel keeps its shape when the selection
   changes rather than jumping up the page. */
.slotmixed{display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:76px;color:var(--tx3);font-size:11.5px;line-height:1.5;padding:10px 14px}

/* ---------- the rule picker ---------- */
.rprow{display:flex;gap:10px;align-items:center;padding:6px 9px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.rprow:hover{background:var(--bg3)}
.rpnm{flex:1 1 50%;font-family:var(--mono);font-size:11.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rpnm.paint{color:var(--info)}
.rpmeta{flex:0 1 auto;font-size:10.5px;color:var(--tx3);white-space:nowrap}
.tag.paintonly{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,var(--bg))}

/* ---------- slots ---------- */
/* Round 18cm: **a little more air, and the light.** Robin: "Make the spacing between grass
   cards a tiny bit wider, and add the 9px glow on each of the cards too. This is the only
   other place I want it in the tool except where it is already implemented. Skip it for the
   Redoran theme though."

   The gradient is the one `#topbar` and `.sect>.sh` wear, at the same `--bloom` — so
   Redoran skips it by construction rather than by exception: its `--bloom` is 0% (18cg),
   which mixes the accent to nothing and leaves the card flat. A card is a tenth of the top
   bar's area, and the corner still reads at that size because the gradient's own extent is
   in percentages of the box rather than in pixels. */
.slot{
  background:var(--bg3);border:1px solid var(--line);border-radius:6px;
  padding:8px 9px;margin-bottom:10px;
  background-image:radial-gradient(84% 300% at 0% 0%,
    color-mix(in srgb,var(--ac) var(--bloom),transparent) 0%, transparent 76%);
}
.slot.miss{border-color:color-mix(in srgb,var(--err) 44%,var(--bg))}
.slot.fill{border-color:color-mix(in srgb,var(--warn) 28%,var(--bg))}
.slothead{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.slothead .ix{
  font-family:var(--mono);font-size:10px;color:var(--tx3);background:var(--bg);
  padding:1px 5px;border-radius:3px;border:1px solid var(--line2);flex:0 0 auto;
}
.slothead .pct{
  font-family:var(--mono);font-size:11px;color:var(--ac);flex:0 0 auto;
  font-variant-numeric:tabular-nums;
}
.slothead .sp{flex:1}
/* Round 18q: the card's own name, between its number and its share. As wide as what is
   in it (`fitName` sets the ch width), so an unnamed card leaves the percentage where it
   has always been and a named one takes only the room it needs. */
.slothead .cardname{
  flex:0 0 auto;min-width:4ch;font-size:11px;padding:1px 5px;
  background:var(--bg);border:1px solid var(--line2);border-radius:3px;color:var(--tx2);
}
.slothead .cardname:focus{outline:none;border-color:var(--ac2);color:var(--tx)}
.slothead .cardname::placeholder{color:var(--tx3)}
/* And its two folded sections. The same caret and the same manners as the left column's
   sections, at the card's scale. */
.cardsec{margin-top:6px;border-top:1px solid var(--line)}
.cardsh{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  padding:5px 0 4px;font-size:11px;color:var(--tx2)}
.cardsh:hover{color:var(--tx)}
.cardsh .caret{font-size:9px;color:var(--tx3);transition:transform .12s}
.cardsec.closed .cardsh .caret{transform:rotate(-90deg)}
/* Round 18ax: the "2 set" on a folded section as a small olive pill rather than grey
   mono - Robin: "Highlight a little stronger that sets are edited within the collapsed
   section [...] make that message pop a little bit more". */
.cardsn{margin-left:auto;font-size:10px;font-weight:600;color:var(--ac);font-family:var(--mono);
  background:var(--acd);border:1px solid var(--ac2);border-radius:9px;padding:0 6px;line-height:15px}
.cardsec.closed .cardsb{display:none}
/* The picture is a render of the mesh now rather than a swatch of its first texture, so
   it is worth a few more pixels: at 34 square a grass tuft was a green smear. */
.swatch{
  width:46px;height:46px;flex:0 0 46px;border-radius:4px;border:1px solid var(--line2);
  background:#0a0c0f center/contain no-repeat;image-rendering:auto;
}
/* A mesh the install does not have. The card already said "missing" in a small red
   tag, which is easy to miss in a column of eight cards; the swatch is the part of a
   card the eye lands on, so that is where the warning goes. */
.swatch.missing{
  background:color-mix(in srgb,var(--err) 18%,var(--bg));
  border-color:color-mix(in srgb,var(--err) 50%,var(--bg));
  color:color-mix(in srgb,var(--err) 52%,var(--tx));
  display:flex; align-items:center; justify-content:center;
  font-size:17px; line-height:1;
}
/* Where the warnings list just took you. Two seconds, then it fades: long enough to
   find the card among eight, short enough not to become part of how the card looks. */
.slot.flash{animation:slotflash 4s ease-out 1}
@keyframes slotflash{
  0%,55%{box-shadow:0 0 0 2px var(--hot) inset; background:rgba(255,160,120,.10)}
  100%{box-shadow:none; background:transparent}
}
/* And the rule row itself, for the same reason one step earlier: the dialogue closes, the
   panel changes behind it, and without a mark there is nothing to tell you *which* of
   thirty rows the tool just took you to. Three quick pulses rather than one long fade —
   a row is small and a single soft glow on one reads as a hover. */
.sel.flash{animation:selflash 3.2s ease-out 1}
/* A field the warnings list took you to. Same three pulses as the row, so the two read as
   one gesture — "this rule, and this field in it" — rather than as two separate alarms. */
.fld.flash,input.fld.flash{animation:selflash 3.2s ease-out 1;position:relative}
@keyframes selflash{
  0%,15%  {box-shadow:0 0 0 2px var(--hot) inset}
  30%,45% {box-shadow:0 0 0 0 transparent}
  60%,75% {box-shadow:0 0 0 2px var(--hot) inset}
  100%    {box-shadow:0 0 0 0 transparent}
}
/* The ground-texture list, folded away. `#selList` is hidden and the caret turns, the
   same as a section heading — this is the same gesture on a list that happens to live
   above the sections rather than among them. */
#left.folded #selList{display:none}
#btnFoldSel{transition:transform .12s}
#left.folded #btnFoldSel{transform:rotate(-90deg)}
.slotgrid{display:flex;gap:7px;align-items:flex-start}
.slotgrid .fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mini{display:flex;align-items:center;gap:5px}
.mini span{font-size:10.5px;color:var(--tx3);flex:0 0 auto}
.mini .fld{padding:3px 6px;font-size:11.5px}
.tag{
  font-size:9.5px;padding:1px 5px;border-radius:3px;text-transform:uppercase;
  letter-spacing:.4px;font-weight:700;flex:0 0 auto;
}
.tag.ok{background:var(--acd);color:var(--ac)}
.tag.err{background:color-mix(in srgb,var(--err) 18%,var(--bg2));color:var(--err)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,var(--bg2));color:var(--warn)}
.tag.info{background:color-mix(in srgb,var(--info) 18%,var(--bg2));color:var(--info)}

/* ---------- bans ---------- */
.ban{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.ban .fld{font-size:11.5px;padding:4px 7px}
.ban .off{flex:0 0 74px}

/* ---------- viewport ---------- */
#vpwrap{flex:1;position:relative;min-height:0}
#gl{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#gl:active{cursor:grabbing}
#vpover{position:absolute;inset:0;pointer-events:none}
/* Section headings inside the object dialogue. It answers two subjects now — what grass
   does around a thing, and what paint is on it — and a run of controls with no break in
   it read as one long question. Robin: "maybe with a different color in the background
   across the entire row, to more clearly label the two areas" — so each heading is a
   band across the dialogue's full width (the negative margins undo `.mbody`'s padding),
   not a rule under some small caps. */
.axsec{margin:16px -16px 10px;padding:7px 16px;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.8px;color:var(--tx);
  background:var(--bg3);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.axsec:first-of-type{margin-top:12px}
/* The status line in the dialogue's foot: what the last action did. It wore the accent
   colour for a day and Robin asked for the quiet hint voice back — the position beside
   Close is what makes it findable; the colour was shouting. */
#axDone{flex:1;text-align:left;font-size:11px;color:var(--tx3);
  line-height:1.45;align-self:center;min-height:16px}
#stats{
  position:absolute;left:12px;top:12px;background:rgba(21,21,21,.88);
  border:1px solid var(--line);border-radius:6px;padding:9px 11px;
  font-family:var(--mono);font-size:11px;line-height:1.65;pointer-events:auto;
  backdrop-filter:blur(6px);min-width:190px;max-width:320px;
}
/* Label left, value right, and the gap between them is a rule rather than a hope:
   the value used to float right, and a float overlaps the flow it floated out of the
   moment label plus value outgrew the row — which is what overlapping text in this box
   was. Flex cannot overlap; a value too big for its row pushes the box wider, up to
   the max above, and the strings that can genuinely run long are middle-trimmed with
   the whole of them in the row's tooltip (`midTrim`). */
#stats div{display:flex;gap:12px;align-items:baseline}
#stats div[hidden]{display:none}  /* the flex line above would otherwise outrank [hidden] */
#stats .k{color:var(--tx3);white-space:nowrap}
#stats .v{color:var(--tx);margin-left:auto;font-variant-numeric:tabular-nums;
  text-align:right;overflow-wrap:anywhere}
#stats .v.g{color:var(--ac)}
#stats .v.w{color:var(--warn)}
#stats .v.e{color:var(--err)}
#stats hr{border:none;border-top:1px solid var(--line);margin:6px 0}
#stats .ttl{color:var(--tx2);font-size:10px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
/* Round 18cy: the visit history's arrows on the heading row, and the star on the cell row.
   The arrows sit at the row's far end; a disabled one is dimmed rather than hidden, so the
   row keeps its shape whichever way there is to go. The star stands at the name's side -
   the value's own auto margin moves to it, so the two read as one thing. */
#stats .hist{margin-left:auto;display:flex;gap:3px;align-items:center}
#stats .hist[hidden],#stats .fav[hidden]{display:none}   /* the flex above would outrank [hidden] */
#stats .hist button{font:inherit;font-size:9px;line-height:1;padding:2px 5px;background:transparent;
  border:1px solid var(--line);border-radius:4px;color:var(--tx2);cursor:pointer}
#stats .hist button:not(:disabled):hover{color:var(--tx);border-color:var(--tx3)}
#stats .hist button:disabled{opacity:.35;cursor:default}
/* Round 18cz: closer to the name - the row's 12px gap is for label and value, and the star
   is part of the value; a negative margin takes most of it back. Robin: "the star is a bit
   too far away from the name". */
#stats .fav{margin-left:auto;margin-right:-8px;cursor:pointer;font-size:13px;line-height:1;padding:0 1px;user-select:none;color:var(--tx3)}
#stats .fav[data-on="1"]{color:var(--warn)}   /* the map's own star colour */
#stats .fav+.v{margin-left:0}
/* The inspected mesh's panels — its textures, and its retextures under them — standing
   where the cell stats box stands otherwise: the two never show together, because
   inspecting a mesh is what hides the stats. The wrapper is the column; each panel
   scrolls for itself when the pair outgrows the viewport. */
#inspanels{
  position:absolute;left:12px;top:12px;width:238px;display:flex;flex-direction:column;
  gap:10px;max-height:calc(100% - 96px);pointer-events:none;
}
#meshHead,#texPanel,#retexPanel,#avoidPanel{
  background:rgba(21,21,21,.88);
  border:1px solid var(--line);border-radius:6px;padding:9px 11px;
  pointer-events:auto;backdrop-filter:blur(6px);
  overflow:auto;min-height:0;flex:0 1 auto;
}
#meshHead,#avoidPanel{flex:0 0 auto;overflow:hidden}
/* Round 5: the lock as a corner glyph — open or shut is the state, at a glance. It
   wears the warn colour while shut, because a locked setup is the thing every
   refused edit will be about. */
/* Round 18ad: bigger, and it says which state it is in. Robin: "Make the lock button a bit
   bigger in the mesh editing mode, and write next to the symbol 'Locked' 'Unlocked' for the
   two states." A shackle that moves by two pixels is a fine thing to *recognise* and a poor
   thing to read the first time; the word settles it, and the glyph keeps saying it at a
   glance once you know. */
#meshLockBtn{position:absolute;right:12px;top:12px;z-index:25;pointer-events:auto;
  display:flex;align-items:center;gap:8px;line-height:1;
  padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--tx);font-size:12.5px;
  background:rgba(21,21,21,.88);border:1px solid var(--line);backdrop-filter:blur(6px)}
#meshLockBtn .mlg{display:flex;line-height:0}
#meshLockBtn:hover{border-color:var(--ac)}
/* Round 17k: Recentre, under the lock, where the cell's stack would be. The lock is
   26px of glyph in 9px of padding, so this clears it and keeps the stack's own gap.
   18a: the navigation button takes that slot and Recentre moves one button down, so the
   editor's corner reads lock, scheme, recentre - the cell's stack in miniature. */
/* Round 18z: the glyph is drawn now, so the gold reaches it as well as the border - the
   shackle and the frame say the same thing in shape and in colour. */
/* Round 18ad: and a thicker ring while it is shut. As a second border it would move the
   button a pixel at every toggle; as a shadow the ring doubles and nothing else does. */
#meshLockBtn.locked{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 20%,var(--bg2));
  color:var(--warn);box-shadow:0 0 0 1.5px var(--warn)}
/* Round 6 item 2: while the setup is locked, the editor's edit controls stand down.
   `.held` dims and disarms a control the lock refuses — the tiles keep their hover
   and their right-click grid, because *finding* other meshes is not an edit. */
.textile .trule.held,.textile .tinset:disabled{opacity:.45}
.textile .trulex.held{opacity:.4;cursor:default}
.textile .trulex.held:hover{background:none}
#texPanel .ttl,#retexPanel .ttl{color:var(--tx2);font-size:10px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
#texGrid,#retexGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
#retexPanel .hint{margin-top:7px}
/* One mesh as a tile: picture, name strip, and the top strip a decision reads.
   Worn by the retextures panel and by the install-wide texture grid dialogue. */
.meshtile{position:relative;border:1px solid var(--line);border-radius:5px;cursor:pointer;
  background-size:cover;background-position:center;aspect-ratio:1/1;overflow:hidden;
  background-color:#2a2a2a}
.meshtile:hover{border-color:var(--ac)}
.meshtile.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.meshtile.lk{cursor:not-allowed;opacity:.72}
.meshtile .tname{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);
  font-size:10px;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meshtile .tbadge{position:absolute;left:0;right:0;top:0;background:rgba(0,0,0,.62);
  font-size:10px;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The first install scan reads thousands of files; this is what stands in for the
   answer while it does — a line of counted progress and a fill bar (round 3: "it
   takes a long time to do so with no feedback"). */
.loadwrap{display:flex;flex-direction:column;gap:7px;align-items:stretch;padding:14px 8px}
.loadbar{height:6px;border:1px solid var(--line);border-radius:4px;overflow:hidden;
  background:rgba(0,0,0,.3)}
.loadbar>div{height:100%;width:0%;background:var(--ac);transition:width .25s}
/* Round 17k: before the count is known, a stripe that travels rather than a bar sitting
   at nothing — "working, and I do not yet know how much of it". */
.loadbar>div.indet{width:36%;transition:none;
  background:linear-gradient(90deg,transparent,var(--ac),transparent);
  animation:indetslide 1.1s linear infinite}
@keyframes indetslide{from{transform:translateX(-100%)}to{transform:translateX(320%)}}
/* The give/take pair on a retexture tile — over the picture, under the name strip. */
.meshtile .tcopy{position:absolute;right:3px;bottom:18px;display:flex;gap:3px}
.meshtile .tcopy button{border:1px solid var(--line);background:rgba(0,0,0,.62);
  color:var(--tx);border-radius:4px;font-size:11px;line-height:1;padding:3px 5px;cursor:pointer}
.meshtile .tcopy button:hover{border-color:var(--ac);color:var(--ac)}
.textile{position:relative;border:1px solid var(--line);border-radius:5px;cursor:pointer;
  background-size:cover;background-position:center;aspect-ratio:1/1;overflow:hidden;
  background-color:#2a2a2a}
.textile:hover{border-color:var(--ac)}
.textile .tname{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);
  font-size:10px;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.textile .trule{position:absolute;left:0;right:0;top:0;background:rgba(0,0,0,.62);
  font-size:10px;padding:2px 4px;color:var(--ac);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.textile .trule.miss{color:var(--warn)}
/* The way off the tile (round 4 item 1): a red ✕ at the rule strip's right end. The
   strip leaves it room so a long rule name never sits under it. */
.textile .trule{padding-right:16px}
.textile .trulex{position:absolute;right:2px;top:1px;padding:1px 4px;color:var(--err);
  cursor:pointer;font-size:10px;border-radius:3px}
.textile .trulex:hover{background:rgba(255,80,80,.22)}
/* Item 7's reach slider, over the picture and above the name strip. Its track is the
   tile, so it stays readable at tile size; the thumb carries the accent. */
.textile .tinset{position:absolute;left:3px;right:3px;bottom:17px;width:calc(100% - 6px);
  margin:0;height:12px;cursor:ew-resize;accent-color:var(--ac);background:transparent}
.textile .tinset:disabled{cursor:not-allowed;opacity:.5}
#texPanel .hint{margin-top:7px}
/* One rule for both stacks (round 18m): the cell's and the mesh editor's are the same
   column of the same buttons, so a change to one cannot leave the other looking older. */
#vptools,#meshTools{
  position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;
  pointer-events:auto;align-items:flex-end;
}
/* Round 18l: the editor's stack starts under the lock, where Recentre used to. After the
   shared rule above, so its `top` wins. */
/* 18ad: the lock grew a word and two pixels of glyph, so this drops to clear it. */
#meshTools{top:68px;z-index:25}
#meshTools[hidden]{display:none}
.vpbtn{
  background:rgba(21,21,21,.88);border:1px solid var(--line);border-radius:5px;
  padding:5px 9px;font-size:11.5px;backdrop-filter:blur(6px);
}
.vpbtn:hover{background:rgba(45,45,42,.96)}
.vpbtn.on{background:var(--acd);border-color:var(--ac2);color:var(--ac)}
/* Round 18bd (C4): a direction in the copy-setup dialogue whose source mesh has nothing
   set up on it. Robin: "gray out that specific choice for meshes that have no data." Not
   `disabled`, because it is still worth clicking — the flip is how you see what the other
   direction would carry, and the note under the pair says why this one cannot go. */
.vpbtn.off{color:var(--tx3);border-color:var(--line);background:var(--bg3)}
.vpbtn.off.on{color:var(--tx3);border-color:var(--line2);background:var(--bg4)}
/* Round 17i: the navigation button says which scheme is on in the colours of the two
   things it is like — Orbit in the "No grass" tool's salmon, WASD in the ordinary
   toggled-on olive. Robin asked for exactly that pair; everything else about the button
   is the plain `.vpbtn`. */
/* Round 18cj: orbit navigation has a colour of its own (`--orbit`) rather than borrowing
   the "no grass" paint's salmon, which is what `--hot` is. Robin: "The orbit pivot, and the
   navigation mode button's orbit state color in the viewport should also have a color
   assigned to the theme." The pivot ball and its stamp on the ground read the same token —
   the renderer is handed it by `Themes.tellRenderer`. */
#tbNav.orbit,#meshNav.orbit{background:color-mix(in srgb,var(--orbit) 18%,var(--bg2));
  border-color:var(--orbit);color:var(--orbit)}
#tbNav.wasd,#meshNav.wasd{background:var(--acd);border-color:var(--ac2);color:var(--ac)}
select.vpbtn{color:var(--tx2);max-width:190px}
/* Round 17: the flying camera's speed bar - the right edge, mid height, always up
   while the WASD scheme is on. A range input stood on end. */
#vpSpeed{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:rgba(21,21,21,.86);border:1px solid var(--line);border-radius:6px;
  padding:7px 5px;pointer-events:auto;backdrop-filter:blur(6px);
}
#vpSpeed[hidden]{display:none}
#vpSpeed .spv{font-size:10.5px;font-family:var(--mono);color:var(--tx);min-width:40px;text-align:center}
#vpSpeed .spl{font-size:9.5px;color:var(--tx3);letter-spacing:.4px;text-transform:uppercase}
#vpSpeedBar{
  writing-mode:vertical-lr;direction:rtl;width:18px;height:150px;margin:2px 0;
  accent-color:var(--ac);cursor:ns-resize;   /* the same slider as every other one (round 17c) */
}
#vpSpeed .sppop{
  position:absolute;right:52px;top:50%;transform:translateY(-50%);
  font-size:13px;font-family:var(--mono);color:var(--ac);background:rgba(21,21,21,.92);
  border:1px solid var(--ac2);border-radius:6px;padding:4px 9px;white-space:nowrap;pointer-events:none;
}
#vpSpeed .sppop[hidden]{display:none}
#busy{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:rgba(21,21,21,.72);backdrop-filter:blur(3px);
  pointer-events:auto;z-index:20;
}
#busy[hidden]{display:none}
/* Round 18bo. Robin: "The progress bar and button for exporting a .esp isn't shown on top
   of the Export groundcover .esp dialogue. I think it should lie on top of the export
   dialogue, and darken the export dialogue out as long as the export progress bar is
   open."

   The card is `position:absolute` inside the viewport pane at z-index 20, which is right
   when the thing it is covering *is* the viewport — the left column stays legible and you
   can see what is being loaded behind it. A dialogue is `position:fixed` at z-index 150, so
   the card was underneath it and off to one side: the export ran with its own progress bar
   hidden behind the dialogue that started it.

   So when the work was started from a dialogue, the card goes over the whole window
   instead. Between the toasts (200) and the tooltip (400), because a card that blocks the
   window should cover a message about something else, and nothing should cover the
   tooltip. `Busy.show` decides which of the two it is by looking for an open dialogue —
   the card does not need to be told, and cannot be told wrong. */
#busy.overall{position:fixed;z-index:300}
/* Round 18bo. Robin: "clicking 'Cancel export' makes the confirmation dialogue pop up
   blurred out and darkened behind the Generating plugin, instead of on top of it, making it
   impossible to click." Mine, from raising the card over dialogues an hour earlier — the
   card's whole job is to be in front of the window, and the question the card itself asks
   is part of that window.

   So the layers are stated once, here, in the order they have to be in:
     dialogues 150  ·  toasts 200  ·  the busy card 300  ·  a question 350  ·  tooltip 400
   A question is always on top, because it is the only thing on screen that can be answered
   and there is nothing it would make sense to bury it under. Not conditional on a card
   being up: a rule that holds sometimes is a rule somebody has to remember. */
#mChoice{z-index:350}
#busy .card{
  background:var(--bg2);border:1px solid var(--line2);border-radius:9px;
  padding:18px 22px;min-width:340px;box-shadow:0 16px 48px rgba(0,0,0,.5);
}
#busy .lbl{font-size:12.5px;color:var(--tx);margin-bottom:4px}
#busy .sub{font-size:11px;color:var(--tx3);font-family:var(--mono);margin-bottom:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Wraithguard: the loading figures under "Placing objects" (LoadProf.live), several lines. */
#busy .card{max-width:min(720px,92%)}
#busy .sub.multi{white-space:pre-line;overflow-wrap:anywhere}
#busy .track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
#busy .fill{height:100%;background:var(--ac2);width:0%;transition:width .18s ease-out}
#busy .fill.indet{
  width:35%;background:linear-gradient(90deg,transparent,var(--ac2),transparent);
  animation:sweep 1.1s ease-in-out infinite;
}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
/* Round 18bo: the clock and the percentage share one row across the bar's width. */
#busyFoot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:5px}
#busyTime{font-size:10.5px;color:var(--tx3);font-family:var(--mono);
  /* Tabular figures: a clock whose digits change width jitters the whole row once a
     second, which reads as the window stuttering rather than as time passing. */
  font-variant-numeric:tabular-nums}
#busy .pct{font-size:10.5px;color:var(--tx3);font-family:var(--mono);text-align:right;
  font-variant-numeric:tabular-nums}
/* Round 18bn: the Cancel that sits under the bar. Centred under it rather than beside
   the percentage, so it reads as a way out of the whole card and not as a label. */
#busyStop{margin-top:11px;text-align:center}
#vphint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  font-size:11px;color:var(--tx3);background:rgba(21,21,21,.84);
  padding:4px 12px;border-radius:12px;backdrop-filter:blur(6px);white-space:nowrap;
}
/* The legend, lower right. Deliberately quiet: the viewport is the thing being looked at
   and this is a key to it, so it sits at the same weight as the control hint opposite and
   disappears the moment nothing on the ground is marked. */
/* Round 18l: in the mesh editor the bottom-right corner is the destructive pair's, so
   the legend stands above them - `placeLegend` measures the pair and sets `bottom`. */
#legend{
  position:absolute;right:12px;bottom:14px;background:rgba(21,21,21,.86);
  border:1px solid var(--line);border-radius:6px;padding:7px 10px;
  font-size:10.5px;line-height:1.55;color:var(--tx2);backdrop-filter:blur(6px);
  max-width:270px;pointer-events:none;
}
#legend[hidden]{display:none}
#legend .lgrow{display:flex;align-items:center;gap:7px;white-space:nowrap}
#legend .lgsw{width:9px;height:9px;flex:0 0 9px;border-radius:2px;
  box-shadow:0 0 0 1px rgba(0,0,0,.55)}
#legend .lgnote{color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
#noctx{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;text-align:center;padding:40px;
  background:rgba(12,15,20,.92);
}
/* an id selector outranks the UA [hidden] rule, so hidden must be restated here
   or this overlay stays laid out on top of the canvas and eats every pointer event */
#noctx[hidden]{display:none}
#noctx .big{font-size:15px;color:var(--tx2)}
/* The empty simplified viewport. No backdrop — there is nothing behind it to cover, and
   a panel over an empty scene would look like something failed. Pointer-events off: the
   camera still orbits an empty world, which is less alarming than a viewport that has
   stopped responding. */
#vpempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:40px;pointer-events:none}
#vpempty[hidden]{display:none}
#vpempty .big{font-size:15px;color:var(--tx2)}
#noctx .sm{font-size:12.5px;color:var(--tx3);max-width:430px;line-height:1.65}
/* Round 18ed: the bar is the viewport's own foot, ending where the right column begins,
   and each side column carries its own strip at its bottom instead. */
#vpbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 12px;
  /* The same height as the two panel feet (18ed): the three strips are one line across
     the bottom of the window, and their top borders meet. */
  height:var(--foot-h);
  background:var(--bg2);border-top:1px solid var(--line);
  /* No wrapping: the bar is one line across the viewport, and a long ground note gives
     way before the status does (its own ellipsis, below). */
  flex-wrap:nowrap;overflow:hidden;
}
#vpbar>.grp:first-child{min-width:0}
#vpbar>.grp:first-child>span{overflow:hidden;text-overflow:ellipsis}
#vpbar .grp{display:flex;align-items:center;gap:6px}
#vpbar .grp>span{font-size:11px;color:var(--tx3);white-space:nowrap}
#vpbar .fld{width:auto;padding:3px 6px;font-size:11.5px}
/* `accent-color` is gone from here: styling the thumb above turns it off, and a property
   that cannot apply is a property that misleads whoever reads this next. */
#vpbar input[type=range]{width:96px;accent-color:var(--ac)}
#vpbar .vsep{width:1px;height:18px;background:var(--line)}
#vpbar .gi{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
/* What the window is doing, at the right-hand end of the bottom bar. The message keeps
   a fixed slot and the track keeps its space when there is nothing to show, so neither
   makes the bar jump about every time a rescatter starts and stops. */
#vpStatus{flex:0 0 auto;gap:8px}
#vpStatus .msg{font-size:11px;white-space:nowrap;text-align:right;
  min-width:190px;overflow:hidden;text-overflow:ellipsis;color:var(--tx3)}
#vpStatus .msg.work{color:var(--ac)}
#vpStatus .msg.wait{color:var(--warn)}
#vpStatus .track{width:110px;height:5px;border-radius:3px;background:var(--bg);
  border:1px solid var(--line);overflow:hidden;visibility:hidden}
#vpStatus .track.on{visibility:visible}
#vpStatus .fill{height:100%;width:0%;background:var(--ac2);transition:width .16s ease-out}
#vpStatus .fill.indet{width:35%;background:linear-gradient(90deg,transparent,var(--ac2),transparent);
  animation:sweep 1.1s ease-in-out infinite}

/* ---------- toast / status ---------- */
/* Round 9 item 4: the messages in the corner. They were small, brief and gone —
   Robin: "bigger, and more descriptive. Let them linger a bit longer." So: more room
   for a sentence that says what happened rather than a word that names it, a longer
   stay, and — where the message is about a place in the program — a line saying it can
   be clicked, which takes you there. */
#toasts{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:200;align-items:flex-end;
  pointer-events:none}
/* The stack itself takes no clicks — it lies over the viewport, and a corner of it that
   swallowed a drag would be worse than no messages. Each message takes its own. */
#toasts>*{pointer-events:auto}
.toast{
  background:var(--bg3);border:1px solid var(--line2);border-left:3px solid var(--info);
  border-radius:6px;padding:11px 15px;font-size:13px;line-height:1.45;max-width:470px;
  box-shadow:0 6px 22px rgba(0,0,0,.45);animation:tin .16s ease-out;
}
.toast.ok{border-left-color:var(--ac)}
.toast.warn{border-left-color:var(--warn)}
.toast.err{border-left-color:var(--err)}
/* A message that knows where its subject is. The cue is a line rather than a button:
   the whole message is the target, and a button inside it would invite the eye to aim
   at something the size of a word. */
.toast.go{cursor:pointer}
.toast.go:hover{background:var(--bg4);border-color:color-mix(in srgb,var(--line2) 72%,var(--tx) 28%)}
.toast .tgo{margin-top:5px;font-size:11.5px;color:var(--ac);display:flex;gap:5px;align-items:center}
.toast.go:hover .tgo{color:var(--tx)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#folderState{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx3);min-width:0}
#folderState .d{width:7px;height:7px;border-radius:50%;background:var(--err);flex:0 0 7px}
#folderState.ok .d{background:var(--ac)}
#folderState .p{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,10,9,.72);display:flex;align-items:center;justify-content:center;z-index:150;backdrop-filter:blur(2px)}
.modal[hidden]{display:none}
.mbox{background:var(--bg2);border:1px solid var(--line2);border-radius:9px;width:min(860px,92vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.65)}
.mhead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.mhead b{font-size:14px;flex:1}
.mbody{padding:14px 16px;overflow:auto;flex:1;min-height:0}
/* A section heading inside a dialogue (round 17h). Robin: "In the Settings dialogue,
   make the different section headers more clear, with a differentiated bit lighter
   background. Mimic how headlines look in the left most column (except the expand /
   collapse feature)." So: the same band, the same small uppercase lettering and the same
   edges as `.sect>.sh` — reaching the dialogue's own edges rather than floating inside
   its padding, which is what makes a heading look like a heading and not like a bold
   line of the section above it. No caret: there is nothing to fold here. */
.mbody>.mhead2{
  display:flex;align-items:center;gap:7px;padding:8px 16px;
  margin:16px -16px 10px;
  font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--tx2);
  background:var(--bg3);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
/* The first one sits against the dialogue's own head, so it needs no gap above it and no
   second line where the head already drew one. */
.mbody>.mhead2:first-child{margin-top:-14px;border-top:0}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
/* Which rules go in an exported copy. Its own block above the file it is about to
   write, so the list and the preview of the result read top to bottom in the order the
   decision is made. Bounded height: a set of a hundred and thirty rules must not push the
   .toml itself off the screen, which is the other half of what this dialogue is for. */
.expsec{
  background:var(--sunk);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin-bottom:12px;
}
/* Said once for both exporters. The grass rules and the mesh setups are two different
   things to send somebody, but choosing which of them travel is one act and has to look
   like one — Robin, of the statics exporter: "make it work exactly like the export copy
   of grass rules dialogue instead". A second copy of these rules is a second thing to
   forget to change. */
.explist{max-height:220px;overflow:auto;border-top:1px solid var(--line);padding-top:4px}
.explist .exgroup{
  font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);
  padding:9px 2px 3px;user-select:none;display:flex;gap:8px;align-items:baseline;
}
.explist .exgroup .n{text-transform:none;letter-spacing:.2px}
.explist label{
  display:flex;align-items:center;gap:8px;padding:3px 2px;cursor:pointer;border-radius:4px;
}
.explist label:hover{background:var(--bg3)}
.explist .nm{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.explist label.paint .nm{color:color-mix(in srgb,var(--info) 42%,var(--tx))}
.explist .sub{flex:0 0 auto;font-size:10.5px;color:var(--tx3)}
/* A section heading inside an `.expsec`, with its count on the right. The Advanced scope
   stacks three lists in one dialogue and they have to be tellable apart at a glance. */
.exhead{
  display:flex;gap:8px;align-items:baseline;justify-content:space-between;
  font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx2);
  margin:0 0 6px;user-select:none;
}
.exhead .n{text-transform:none;letter-spacing:.2px;color:var(--tx3)}
/* The three Advanced lists are shorter than the exporter's one: three of them at 220px
   would put the Generate button a long way below the fold. */
#espAdvBox .explist{max-height:150px}
/* A row nothing can be exported from: no loaded rule reaches that ground. Dimmed rather
   than hidden, because "there is nothing here for your rules" is an answer and an absent
   row is not one — and the Edited cells chip is there for anybody who wants them gone. */
.explist label.off{opacity:.45}
.explist label.off .nm{font-style:italic}
.exout{
  width:100%;height:52vh;background:var(--bg);border:1px solid var(--line2);border-radius:6px;
  padding:11px;font-family:var(--mono);font-size:11.5px;line-height:1.55;resize:none;white-space:pre;
}
/* Round 18cf: **10px, and not in the radius scale.** Robin: "Pills stay round by the way,
   as you say they have a deliberate meaning, and I don't think we should change that." It
   is the one radius in the file doing a job rather than a style — on an 18px-tall element a
   capsule is a shape, and it is how a *reading* is told apart from a *control*. Every pill
   in this program reports; none of them offers. Do not fold it into `--r-ctl`. */
.pill{font-size:11px;color:var(--tx3);background:var(--bg3);border:1px solid var(--line);padding:2px 8px;border-radius:10px}
/* Derived from `--warn` so a theme carries it: the three literals it had only meant
   "a warm band" against a near-black ground. */
.warnbox{background:color-mix(in srgb,var(--bg3) 80%,var(--warn) 20%);
  border:1px solid color-mix(in srgb,var(--warn) 32%,var(--bg4));
  border-radius:var(--r-box);padding:9px 11px;font-size:11.5px;
  color:color-mix(in srgb,var(--warn) 38%,var(--tx));line-height:1.6;margin-bottom:10px}
.warnbox b{color:var(--warn)}
/* The list inside a problem box, and the row that offers the rest of it. Opened, the list
   gets a ceiling and scrolls: a hundred warnings must not push the .toml itself off the
   screen, which is the thing the dialogue is actually for. */
/* A rule switch's name in the simplified preview. A button, because it does something —
   it opens the rule — and looking like plain text next to a switch that also does
   something would leave you guessing which half of the row you are aiming at. */
/* ---------- the asset picker, in two views ---------- */
/* A row is a row and a tile is a tile, but both are `.brow`, so picking, starring and the
   selected background are written once and the view only decides the shape. */
.brow{display:flex;align-items:center;gap:8px;padding:5px 9px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.brow:hover{background:var(--bg3)}
.brow.picked{background:var(--acd)}
.bpath{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#brList.grid,#ltList.grid,#opList.grid{display:grid;gap:8px;padding:9px;
  grid-template-columns:repeat(auto-fill,minmax(116px,1fr))}
#brList.grid .brow,#ltList.grid .brow,#opList.grid .brow{
  flex-direction:column;align-items:stretch;gap:3px;position:relative;
  padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg2)}
#brList.grid .brow:hover,#ltList.grid .brow:hover,#opList.grid .brow:hover{border-color:var(--line2)}
#brList.grid .brow.picked{border-color:var(--ac2)}
/* The picture, and what stands in when there is none.
 *
 * Not every mesh has one: a collision-only shape, a marker, or anything whose parts name
 * no texture has nothing to show. A tile that just stayed dark would be indistinguishable
 * from one still loading, so `.none` wears a faint check — the conventional "nothing
 * here", quiet enough not to compete with the tiles that do have a picture. */
/* The live one. It *replaces* the still picture rather than covering it: the canvas is
   transparent everywhere the mesh is not, so leaving the still one behind showed two
   copies of the same object, one of them frozen at the angle it was drawn at. The tile's
   background is put by when the first live frame is already in the canvas and given back
   when the pointer leaves, so neither swap blinks. `pointer-events:none` so the canvas is
   not what gets clicked. */
.bspin{position:absolute;inset:0;width:100%;height:100%;border-radius:5px;
  pointer-events:none}
/* The way out of a viewport mode: bottom-left, bigger than the toggles top-right,
   because leaving is the thing you look for when you are done and it should not be a
   hunt. Same accent as other primary actions. */
/* The destructive pair, opposite the exit and dressed apart from everything else —
   mauve, Robin's colour for "this deletes something". */
.btn.mauve{background:color-mix(in srgb,var(--info) 30%,var(--bg2));
  border-color:color-mix(in srgb,var(--info) 56%,var(--bg));
  color:color-mix(in srgb,var(--info) 24%,var(--tx))}
.btn.mauve:hover{background:color-mix(in srgb,var(--info) 42%,var(--bg2));
  border-color:color-mix(in srgb,var(--info) 76%,var(--bg))}
#vpDanger{position:absolute;right:16px;bottom:16px;z-index:30;display:flex;
  flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
/* Inside the stack the exit geometry is kept but not the absolute corner. */
#vpDanger .vpdanger{position:static}
.btn.mauve:disabled{opacity:.45;cursor:not-allowed}
/* The ways out, stacked bottom-left: the mesh editor has two and everywhere else has
   one. Mirrors #vpDanger opposite it, down to keeping the button geometry and dropping
   the absolute corner inside the stack. */
#vpLeave{position:absolute;left:16px;bottom:16px;z-index:30;display:flex;
  flex-direction:column;gap:8px;align-items:flex-start;pointer-events:auto}
#vpLeave .vpexit{position:static}
/* A switch that is not yours to touch looks like one. `disabled` on the input alone
   changed nothing visible — the track is a sibling span and knows nothing about it —
   which is why the mesh editor's avoidance switch stayed bright under a lock while
   refusing every click. Robin: "Gray out the Obstacle avoidance toggle in the Mesh
   editor when the mesh is locked." */
.sw input:disabled+.tr{opacity:.4}
.sw:has(input:disabled){cursor:not-allowed}
.vpexit{position:absolute;left:16px;bottom:16px;z-index:30;
  font-size:16px;font-weight:600;padding:12px 22px;border-radius:8px;
  box-shadow:0 3px 14px rgba(0,0,0,.42);
  /* It lives inside #vpover, whose pointer-events:none is inherited — without this the
     button is a picture of a button: visible, hit-tested straight through to whatever
     sits behind it. Robin: "not clickable, and thus do nothing". */
  pointer-events:auto}
/* "Paint on statics too", while a room forces it on: still shown, clearly not yours to
   touch. The checkbox is disabled underneath — that is what makes it non-interactive.
   No pointer-events:none here: it also swallowed the hover, so the "Always on in
   interiors" tooltip never showed, which was the one thing left explaining the state. */
#paintStaticsRow.forced{opacity:.55}
/* Round 17y: any row a room takes out of reach - the Atmosphere switch, forced off. */
.row.forced{opacity:.55}
.bthumb{position:relative;width:100%;aspect-ratio:1;border-radius:5px;border:1px solid var(--line);
  background-color:var(--bg);background-size:cover;background-position:center;
  background-image:none;
  image-rendering:pixelated}
.bthumb.none{background-image:
  linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%),
  linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%);
  background-size:14px 14px;background-position:0 0,7px 7px}
.bname{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Round 18bg: "No visuals", written across the tile of a record with nothing to draw —
   Robin: "If the object misses something to render completely, write a message in the
   grid square". The checkerboard behind it already says "nothing here"; the words say
   *why* nothing is there, which on an object picker is a real answer rather than a
   failure: a leveled list whose creatures share no mesh, a record whose model the install
   does not ship, an activator that is a trigger box. Sized to fit the narrowest tile. */
.bnovis{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:4px;font-size:10px;line-height:1.25;color:var(--tx3);
  pointer-events:none}
.bdir{font-family:var(--mono);font-size:9.5px;color:var(--tx3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* In a tile the star floats over the corner of the picture; in a row it sits at the end
   of the line, which is what `.fav`'s own inline style already does. */
#brList.grid .fav,#ltList.grid .fav,#opList.grid .fav{position:absolute;top:9px;right:9px;
  background:rgba(0,0,0,.55);border-radius:4px}
.prule{
  flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;
  background:none;border:0;padding:2px 4px;margin:0;border-radius:4px;
  font:inherit;text-align:left;cursor:pointer;color:var(--tx);
  overflow:hidden;
}
.prule:hover{background:var(--bg3);color:var(--ac)}
.prule .pn{font-family:var(--mono);font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prule .ps{flex:0 1 auto;font-size:10.5px;color:var(--tx3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prule.off .pn,.prule.off .ps{color:var(--tx3)}
.problems{margin-top:5px}
.problems.all{max-height:230px;overflow:auto;padding-right:4px}
.problem{padding:1px 0}
.morerow{display:flex;align-items:center;gap:9px;margin-top:7px}
.morerow span{flex:1;color:var(--tx3);font-size:11px}
.okbox{background:color-mix(in srgb,var(--ac) 12%,var(--bg2));
  border:1px solid color-mix(in srgb,var(--ac) 28%,var(--bg));border-radius:6px;
  padding:9px 11px;font-size:11.5px;color:color-mix(in srgb,var(--ac) 45%,var(--tx));
  line-height:1.6;margin-bottom:10px}
.logline{font-family:var(--mono);font-size:11px;padding:2px 0;color:var(--tx2)}
.logline.e{color:var(--err)}
.logline.w{color:var(--warn)}
.logline.warn{color:var(--warn)}

/* ---------- Round 18ay: the compass ----------
   Robin: "I like the compass from D of the redesigns. Lets add ONLY that from the D
   alternative, but place it under the Recentre button in the top right corner of the
   view port. Make sure it always points to North relative to the orientation of the
   camera in the viewport." The rose is D's drawing; it sits at the foot of each tool
   stack (the cell's and the mesh editor's), and turns with the camera's azimuth, which
   the renderer reports every frame the camera moves (`Renderer._tellNorth`). The needle
   points to +Y, the game's north, as it lies on the screen.

   Round 18az: the turn is an SVG `rotate` on the rose's own group (written by
   `App.R.onNorth` in 11_events.js), not a CSS transform. A CSS transform (with a
   drop-shadow filter beside it) had the browser rasterise the rose once at its 42 px and
   turn the *bitmap*, and a one-pixel ring turned as a bitmap is a stair of pixels -
   Robin: "It looks a bit pixly now." Turned inside the SVG it is drawn from the paths at
   every angle, and the ring stays a line. Round 18ba: the softness the CSS transition
   gave is back, done by hand - `onNorth` eases the drawn angle towards the camera's over
   a few frames.

   No light on it (18ba): the lantern glow went from the whole sheet - Robin: "It feels a
   bit too inconsistently applied and I think it's safer to remove it and revert back to
   the style that we had before." */
/* Round 18cj: **the rose is coloured from here, not from its own attributes.** Robin: "The
   compass should change color with the rest of the theme." Inline SVG, so a CSS property
   reaches it where a `fill="#99ad6a"` attribute could not be a variable — the four parts
   carry classes now and the drawing itself states no colour at all. The letter keeps its
   outline in the ground colour, which is what makes it readable over the ring it sits on;
   inside `#vpwrap` that ground is the glass's dark one in every theme. */
.compass .ring{stroke:var(--ac)}
.compass .pt{fill:var(--ac)}
.compass .n{fill:color-mix(in srgb,var(--ac) 58%,var(--tx))}
.compass .nl{fill:var(--tx);stroke:var(--bg)}
.compass{
  width:48px;height:48px;border-radius:50%;pointer-events:auto;cursor:default;
  background:rgba(21,21,21,.72);border:1px solid var(--line);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.compass svg{width:42px;height:42px;display:block}

/* ---------- Round 18ay: the tooltip ----------
   Robin: "I want the tooltips as scroll notes." `Tip` (30_tip.js) shows `#tip` for any
   element with a `title`, after the pause a native tooltip takes, and the browser's own
   yellow box never comes. Same words - the `title` is the note - so every keyed tooltip
   is still keyed.

   What it looks like has been through three rounds. 18ay: a serif parchment note with
   clipped corners and hairlines. 18az: the page's own font, lighter. 18ba, Robin: "more
   like the current theming, which means, rounded corners, no horizontal lines. Then I
   want on top of that something that makes them contrast a bit more, like being a bit
   lighter. Keep it simple." So: the app's corners and font, a ground two steps lighter
   than the panels and a border a step lighter than theirs, and nothing else. */
#tip{
  position:fixed;left:0;top:0;z-index:400;pointer-events:none;
  /* Round 18cj: a step away from the panel, whichever way the theme runs. Robin:
     "Redoran Bone theme has almost unreadable tooltips" — the ground was `#2f2f2a`, a
     step *lighter* than a dark panel, and the text is `--tx`, which on a pale theme is
     near-black: near-black on near-black. Derived, it is lighter than the panel on a dark
     theme and darker on a pale one, and the text is legible on both by construction. */
  max-width:340px;color:var(--tx);
  background:color-mix(in srgb,var(--bg4) 94%,var(--tx) 6%);
  font-size:12.5px;line-height:1.45;padding:7px 11px;
  border:1px solid color-mix(in srgb,var(--line2) 62%,var(--tx) 38%);
  border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.55);
  display:none;
  white-space:pre-line;overflow-wrap:break-word;
}
#tip.show{display:block}

/* ---------- the cell picker's map (round 18cp, 31_cellmap.js) ---------- */
/* The dialogue grows for the map — Robin: "Let the picker grow in Map mode" — because a
   world is wider than a list and the list's 860px showed forty-five cells across, about
   Vvardenfell and a third of a Tamriel Rebuilt. A height as well as a width: the list
   sized itself by its rows and a map has no rows, so without one the box would be as tall
   as its buttons. */
#mCell.map .mbox{width:min(1500px,94vw);height:86vh}
#mCell.map .mbody{overflow:hidden}
#cellMap{flex:1;min-height:0;position:relative;overflow:hidden;
  border:1px solid var(--line);border-radius:6px;background:#234a68}
#cellMap[hidden]{display:none}
#cellMap canvas{display:block;cursor:crosshair}
/* The two ways of looking, joined into one control — the same face the kind buttons
   beside it wear, with the middle edge shared so the pair reads as one thing. */
#cellView{display:inline-flex}
#cellView .btn{border-radius:0}
#cellView .btn:first-child{border-radius:var(--r-ctl) 0 0 var(--r-ctl)}
#cellView .btn:last-child{border-radius:0 var(--r-ctl) var(--r-ctl) 0;margin-left:-1px}
#mCell .vsep{width:1px;height:18px;background:var(--line2);margin:0 4px}
/* The note under the pointer: `#tip`'s own colours, because it is the same kind of thing
   — a title, read off a cell rather than an element — placed inside the map's box rather
   than on the window, so it stays with the map when the dialogue moves. */
#cellMap .maptip{position:absolute;left:0;top:0;pointer-events:none;z-index:2;
  max-width:300px;color:var(--tx);
  background:color-mix(in srgb,var(--bg4) 94%,var(--tx) 6%);
  font-size:12px;line-height:1.45;padding:6px 10px;
  border:1px solid color-mix(in srgb,var(--line2) 62%,var(--tx) 38%);
  border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.55);white-space:pre-line}
#cellMap .maptip[hidden]{display:none}
/* What the map has to say while it is being read, or when it cannot be: over the glass
   at the foot of the map, in the viewport's own HUD colours. */
#cellMap .mapnote{position:absolute;left:10px;bottom:8px;z-index:2;pointer-events:none;
  font-size:11.5px;color:#f2ece0;background:rgba(21,21,21,.78);
  padding:4px 9px;border-radius:5px;border:1px solid rgba(255,255,255,.12)}
#cellMap .mapnote[hidden]{display:none}
</style>
</head>
