# The Tools: the load-order lint, the backups, Remove Master, Save Check, tes3cmd, the settings
# file and Setup, and the rest of the Tools page, which calls it as Tauri commands (port step
# 4.4; its history is in CHANGELOG.md).
[package]
name = "toolscore"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
# Plugins read and written as the Editor does (Remove / Rename Master), and its panic guard.
editcore = { path = "../editcore" }
# Merge to master (src/mergemaster.rs): greatness7's merge_to_master (public domain), from our
# fork as editcore takes it.
merge_to_master = { git = "https://github.com/staticnation/merge_to_master", default-features = false, features = ["strip-logs"] }
anyhow = "1"
tes3 = { git = "https://github.com/Greatness7/tes3", default-features = false, features = ["esp"] }
bytes_io = { git = "https://github.com/Greatness7/tes3", package = "bytes_io" }
# Save Check: the setup's data folders (ordercore::cfg), `.omwscripts` lines and Python's repr
# (luacore), tables kept in the order first met, as Python's dicts (indexmap).
ordercore = { path = "../ordercore" }
luacore = { path = "../luacore" }
indexmap = "2"
# Wraithguard's settings file (settings.rs), read for the viewer's pages.
serde_json = "1"
# The Setup page's checks (setup.rs): a customizations TOML parsed for its error, as ordercore reads it.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]


[lints.clippy]
type_complexity = "allow"
