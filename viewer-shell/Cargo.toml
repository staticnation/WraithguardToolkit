[package]
name = "wraithguard-viewer"
version = "0.1.0"
edition = "2021"
description = "Native webview shell: opens one window pointed at a URL, or runs the built-in cell viewer (--cell-viewer). Replaces pywebview as the child-process viewer spawned by wraithguard_toolkit_gui.py -- no Python interpreter involved, so it carries none of PyQt6/sip's free-threading limitations."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Cell-viewer mode (src/cellviewer): the engine, the page's file dialogs, and the
# command layer's argument types.
viewcore = { path = "viewcore" }
# The Editor's records, edits and patch queue (Wraithguard's port step 4.1): the links the
# viewer answers itself (`editor_open`, `editor_link`).
editcore = { path = "editcore" }
# The Conflicts page (Wraithguard's port step 4.3): record and loose-file conflicts, the
# field diff, meshes, textures and the map (`conflicts_*` commands).
conflictcore = { path = "conflictcore" }
# The Tools page (port step 4.4): the lint and the other tools (`tools_*` commands).
toolscore = { path = "toolscore" }
# Merge Settings (and Merge Lands as it moves), as the shell has them.
landcore = { path = "landcore" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Update rules and Sources on the Load order page (commands.rs): HTTPS in plain Rust
# (rustls, Mozilla's roots via webpki-roots), no OpenSSL to ship.
ureq = "3"

# tes3 from our fork, as viewcore has it (see native/Cargo.toml).
[patch."https://github.com/Greatness7/tes3"]
tes3 = { git = "https://github.com/staticnation/tes3" }
bytes_io = { git = "https://github.com/staticnation/tes3" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(wg_check)"] }

# Clippy, as viewcore has it (see viewcore/Cargo.toml for why each is off).
[lints.clippy]
type_complexity = "allow"

[[bin]]
name = "wraithguard-viewer"
path = "src/main.rs"

# Release builds. opt-level 3, not "z": the cell viewer's engine (mesh/texture
# decoding, terrain, load order) runs in this binary and size-optimising it costs
# far more in load time than it saves in bytes.
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true
# Unwind, not abort: greatness7's tes3 crates panic on some malformed files, and the
# engine catches that (viewcore nif::from_crate) and reads the file its own way instead.
# Under "abort" one broken mesh in a load order would close the viewer.
panic = "unwind"
