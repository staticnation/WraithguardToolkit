[package]
name = "wraithguard-toolkit"
version = "5.0.5"
edition = "2021"
publish = false
description = "Wraithguard: the program (the cell viewer, Editor, Load order, Conflicts and Tools pages) on Tauri; started on its own it opens on the settings file's openmw.cfg."

# One workspace for the program and its crates (2026-11-09): one Cargo.lock and one `target`
# (here), where each crate had its own - fifteen of each, a dependency bump made in fifteen
# lock files and every crate built again per crate in CI. A crate is still built and tested
# on its own (`cargo test --manifest-path viewer-shell/editcore/Cargo.toml`, or `-p editcore`
# from here): only what that crate needs is compiled, so the command line and the crates'
# tests need no webview. `gardenfell` is Robin Hjelte's workspace, vendored, and stays its own.
[workspace]
resolver = "2"
members = [
    "check",
    "check-commands",
    "cli",
    "conflictcore",
    "editcore",
    "gardenfell-g7",
    "landcore",
    "luacore",
    "meshopt-port",
    "ordercore",
    "physcore",
    "toolscore",
    "viewcore",
]
exclude = ["gardenfell"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Cell-viewer mode (src/cellviewer): the engine, the page's file dialogs, and the
# command layer's argument types.
viewcore = { path = "viewcore" }
# The Editor's records, edits and patch queue (Wraithguard's port step 4.1): the links the
# viewer answers itself (`editor_open`, `editor_link`).
editcore = { path = "editcore" }
# The Conflicts page (Wraithguard's port step 4.3): record and loose-file conflicts, the
# field diff, meshes, textures and the map (`conflicts_*` commands).
conflictcore = { path = "conflictcore" }
# The Tools page (port step 4.4): the lint and the other tools (`tools_*` commands).
toolscore = { path = "toolscore" }
# Merge Settings (and Merge Lands as it moves), as the shell has them.
landcore = { path = "landcore" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Update rules and Sources on the Load order page (commands.rs): HTTPS in plain Rust
# (rustls, Mozilla's roots via webpki-roots), no OpenSSL to ship.
ureq = "3"

# tes3 from our fork, for every crate of the workspace (a [patch] counts only here, at its
# root): the crates name greatness7's repository, and build ours.
[patch."https://github.com/Greatness7/tes3"]
tes3 = { git = "https://github.com/staticnation/tes3" }
bytes_io = { git = "https://github.com/staticnation/tes3" }

# Tauri 2's Linux stack is gtk-rs 0.18, which brings glib 0.18 (RUSTSEC-2024-0429, an unsound
# VariantStrIter: a segfault in release builds) and, through glib-macros, proc-macro-error 1.0.4
# (RUSTSEC-2024-0370, unmaintained). Our patches keep their names and versions: glib with the
# fix backported from 0.20, proc-macro-error re-exporting proc-macro-error3
# (staticnation/gtk-0.18-patches, its README). Linux only in effect: nothing else builds gtk.
# Drop both when Tauri's webview leaves gtk-rs 0.18 (a wry on WebKitGTK 6).
[patch.crates-io]
glib = { git = "https://github.com/staticnation/gtk-0.18-patches" }
proc-macro-error = { git = "https://github.com/staticnation/gtk-0.18-patches" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(wg_check)"] }

# Clippy, as viewcore has it (see viewcore/Cargo.toml for why each is off).
[lints.clippy]
type_complexity = "allow"

[[bin]]
name = "wraithguard-toolkit"
path = "src/main.rs"

# Release builds. opt-level 3, not "z": the cell viewer's engine (mesh/texture
# decoding, terrain, load order) runs in this binary and size-optimising it costs
# far more in load time than it saves in bytes.
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true
# Unwind, not abort: greatness7's tes3 crates panic on some malformed files, and the
# engine catches that (viewcore nif::from_crate) and reads the file its own way instead.
# Under "abort" one broken mesh in a load order would close the viewer.
panic = "unwind"

# The headless test engine (`wg-view-serve`, check-commands): release speed without the
# link-time work the shipped programs get, which would be minutes of every CI run.
# `cargo build --profile serve ...` puts it in `target/serve/`.
[profile.serve]
inherits = "release"
lto = false
codegen-units = 16
strip = false
