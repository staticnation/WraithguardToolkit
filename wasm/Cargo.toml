# A thin bridge from Greatness7's `tes3` NIF reader to the 3D viewer page.
#
# Deliberately small. This is not a port of anything -- it exposes just enough
# to prove the toolchain works end to end (Rust -> wasm -> browser -> our page)
# and to cross-check `tes3` against `wraithguard.nif` on the same file. The
# pipeline is the risky part; the geometry maths is not, and there is no sense
# writing the second before the first is known to work.
#
# See README.md in this folder for the toolchain and the build.

[package]
name = "mlox_nif_wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
# cdylib is what wasm-bindgen needs; rlib keeps `cargo test` usable on the
# host, which is the only way to test any of this without a browser.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Path dependency rather than a git one, so the build is reproducible from the
# checkout beside this repository and cannot silently move under us. Adjust to
# wherever tes3 lives; the sibling layout is what `subset sort/` already uses.
nif = { path = "../../tes3-main/libs/nif" }
wasm-bindgen = "0.2"

# Smaller output. A viewer that loads a 2 MB three.js can afford a wasm module,
# but there is no reason to ship debug symbols to a browser.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
