#
# Mod Plugin data
#
####################
# Schema:
#
# file_name: String that is the name of the file that is this plugin
#
# for_mod: String that is the `name` of a Mod in the website database that this plugin comes from
#
# on_lists: Array of Mod List slugs (Strings) for mod lists that this plugin should be used in
#
# needs_cleaning: Boolean to indicate if the plugin needs to be cleaned with TES3CMD
#
####################

