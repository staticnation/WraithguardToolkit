<svg viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt pd">
<title id="pt">Structure chart and functional flow for building a patch plugin</title>
<desc id="pd">Top: hierarchical structure chart of build_record_patch with data couples annotated on each call. Bottom: functional flow block diagram of eight steps from selection to written plugin, with three refusal exits.</desc>
<style>
.bgd{fill:#1b1b1f}
.b{fill:#232329;stroke:#3a3a42;stroke-width:1.5;rx:5}
.bx{fill:#232329;stroke:#e06c75;stroke-width:1.5;rx:5}
.bgr{fill:#232329;stroke:#7ddc9a;stroke-width:1.5;rx:5}
.n{font:600 11px system-ui,sans-serif;fill:#e6e6e6}
.s{font:400 9px ui-monospace,monospace;fill:#9a9aa2}
.c{font:400 9px system-ui,sans-serif;fill:#9ecbff}
.l{font:600 11px system-ui,sans-serif;fill:#9a9aa2;letter-spacing:.06em}
.e{stroke:#9a9aa2;stroke-width:1.2;fill:none;marker-end:url(#pa)}
.f{stroke:#e6e6e6;stroke-width:1.4;fill:none;marker-end:url(#pb)}
.x{stroke:#e06c75;stroke-width:1.3;fill:none;marker-end:url(#pc);stroke-dasharray:4 3}
</style>
<defs>
<marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9aa2"/></marker>
<marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e6e6e6"/></marker>
<marker id="pc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e06c75"/></marker>
</defs>
<rect class="bgd" x="0" y="0" width="980" height="720"/>

<text class="l" x="16" y="24">STRUCTURE CHART · build_record_patch</text>
<rect class="b" x="380" y="38" width="210" height="42"/><text class="n" x="396" y="57">build_record_patch</text><text class="s" x="396" y="71">patch/service.py</text>

<rect class="b" x="16" y="140" width="150" height="42"/><text class="n" x="28" y="159">_masters_for</text><text class="s" x="28" y="173">&#8594; required_masters</text>
<rect class="b" x="196" y="140" width="150" height="42"/><text class="n" x="208" y="159">collect</text><text class="s" x="208" y="173">patch/records.py</text>
<rect class="b" x="376" y="140" width="150" height="42"/><text class="n" x="388" y="159">merge_record</text><text class="s" x="388" y="173">patch/merge.py</text>
<rect class="b" x="556" y="140" width="180" height="42"/><text class="n" x="568" y="159">dialogue checks</text><text class="s" x="568" y="173">risk &#183; shifts &#183; anchors</text>
<rect class="b" x="766" y="140" width="150" height="42"/><text class="n" x="778" y="159">_write</text><text class="s" x="778" y="173">&#8594; tes3conv</text>

<rect class="b" x="196" y="238" width="150" height="42"/><text class="n" x="208" y="257">index_map</text><text class="s" x="208" y="271">position_of</text>
<rect class="b" x="376" y="238" width="150" height="42"/><text class="n" x="388" y="257">mapping_for</text><text class="s" x="388" y="271">one per plugin</text>
<rect class="b" x="556" y="238" width="180" height="42"/><text class="n" x="568" y="257">topic_order</text><text class="s" x="568" y="271">patch/dialogue.py</text>
<rect class="b" x="766" y="238" width="150" height="42"/><text class="n" x="778" y="257">build_plugin</text><text class="s" x="778" y="271">land/emit.py</text>

<path class="e" d="M420 80 Q200 100 91 140"/><text class="c" x="196" y="104">selections, load order</text>
<path class="e" d="M450 80 Q330 104 271 140"/><text class="c" x="330" y="122">masters &#8595; records &#8593;</text>
<path class="e" d="M470 80 L460 140"/><text class="c" x="478" y="112">choices</text>
<path class="e" d="M520 80 Q600 100 646 140"/><text class="c" x="590" y="122">carried records</text>
<path class="e" d="M560 80 Q740 100 841 140"/><text class="c" x="726" y="104">document &#8595; path &#8593;</text>
<path class="e" d="M271 182 L271 238"/><text class="c" x="278" y="212">mast_index map</text>
<path class="e" d="M451 182 L451 238"/>
<path class="e" d="M646 182 L646 238"/>
<path class="e" d="M841 182 L841 238"/>

<line x1="16" y1="316" x2="964" y2="316" stroke="#3a3a42" stroke-width="1"/>
<text class="l" x="16" y="348">FUNCTIONAL FLOW · selection to written plugin</text>

<rect class="bgr" x="16" y="368" width="128" height="48"/><text class="n" x="28" y="388">1 · Queue</text><text class="s" x="28" y="403">decisions, editable</text>
<rect class="b" x="182" y="368" width="128" height="48"/><text class="n" x="194" y="388">2 · Masters</text><text class="s" x="194" y="403">in load order</text>
<rect class="b" x="348" y="368" width="128" height="48"/><text class="n" x="360" y="388">3 · Collect</text><text class="s" x="360" y="403">whole records</text>
<rect class="b" x="514" y="368" width="128" height="48"/><text class="n" x="526" y="388">4 · Merge</text><text class="s" x="526" y="403">field by field</text>
<rect class="b" x="680" y="368" width="128" height="48"/><text class="n" x="692" y="388">5 · Remap</text><text class="s" x="692" y="403">mast_index</text>

<rect class="b" x="680" y="486" width="128" height="48"/><text class="n" x="692" y="506">6 · Report</text><text class="s" x="692" y="521">moves &#183; anchors</text>
<rect class="b" x="514" y="486" width="128" height="48"/><text class="n" x="526" y="506">7 · Measure</text><text class="s" x="526" y="521">master sizes</text>
<rect class="bgr" x="348" y="486" width="128" height="48"/><text class="n" x="360" y="506">8 · Write</text><text class="s" x="360" y="521">one new plugin</text>

<rect class="bx" x="182" y="588" width="180" height="48"/><text class="n" x="194" y="608">REFUSE · unknown master</text><text class="s" x="194" y="623">every ref would move</text>
<rect class="bx" x="400" y="588" width="180" height="48"/><text class="n" x="412" y="608">REFUSE · whole and merged</text><text class="s" x="412" y="623">two versions, one record</text>
<rect class="bx" x="618" y="588" width="180" height="48"/><text class="n" x="630" y="608">REFUSE · unmeasurable</text><text class="s" x="630" y="623">header would look corrupt</text>

<path class="f" d="M144 392 L178 392"/>
<path class="f" d="M310 392 L344 392"/>
<path class="f" d="M476 392 L510 392"/>
<path class="f" d="M642 392 L676 392"/>
<path class="f" d="M744 416 L744 486"/>
<path class="f" d="M676 510 L646 510"/>
<path class="f" d="M510 510 L480 510"/>
<path class="x" d="M700 416 Q660 540 708 588"/>
<path class="x" d="M100 416 Q120 520 272 588"/>
<path class="x" d="M578 416 Q560 500 490 588"/>

<rect x="16" y="486" width="300" height="48" rx="5" fill="#232329" stroke="#7ddc9a"/>
<text class="n" x="30" y="506">No source mod is ever opened for writing.</text>
<text class="s" x="30" y="521">Deleting the output restores prior behaviour exactly.</text>
</svg>
